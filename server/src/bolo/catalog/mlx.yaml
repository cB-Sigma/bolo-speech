    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, load average about 20 from other work
    date: '2026-11-18'
    note: 'Through bolo''s HTTP API (device = coreml, placed on the CPU without Metal), voice af_heart; a blend (af_heart(0.6)+am_michael(0.4)) and Hindi (hf_alpha) also spoke. Very slow on MLX''s Linux CPU back end; meant for Apple silicon (the macOS CI job runs it).'
