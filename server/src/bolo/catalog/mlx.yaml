# Models on MLX, Apple's array framework: the GPU of Apple silicon through Metal (engine: mlx, bolo.engines.mlx).
# Install with pip install "bolo-speech[mlx]" (macOS on Apple silicon; elsewhere MLX's Linux CPU wheels run them on
# the CPU, slowly). docs/apple-silicon.md. Repositories pinned to a commit, read from the Hugging Face API on
# 2026-11-18. Whisper weights are OpenAI's (MIT) converted by the mlx-community organisation; Parakeet is NVIDIA's
# (CC-BY-4.0); Kokoro-82M is hexgrad's (Apache-2.0).

- id: whisper-tiny-mlx
  aliases: [mlx-community/whisper-tiny-mlx]
  task: stt
  engine: mlx
  kind: mlx-whisper
  family: Whisper
  languages: &whisper_languages [en, zh, de, es, ru, ko, fr, ja, pt, tr, pl, ca, nl, ar, sv, it, id, hi, fi, vi, he, uk, el, ms, cs, ro, da, hu, ta, 'no', th, ur, hr, bg, lt, la, mi, ml, cy, sk, te, fa, lv, bn, sr, az, sl, kn, et, mk, br, eu, is, hy, ne, mn, bs, kk, sq, sw, gl, mr, pa, si, km, sn, yo, so, af, oc, ka, be, tg, sd, gu, am, yi, lo, uz, fo, ht, ps, tk, nn, mt, sa, lb, my, bo, tl, mg, as, tt, haw, ln, ha, ba, jw, su, yue]
  tier: realtime
  sample_rate: 16000
  size_bytes: 74418802
  params: 39000000
  license: MIT
  license_url: https://github.com/openai/whisper/blob/main/LICENSE
  commercial_use: true
  features: [punctuation, translate, language-detect, word-timestamps]
  description: 'Whisper tiny on MLX (Apple silicon GPU, float16), through mlx-whisper. Multilingual (99 languages);
    detects the language when none is given; word timestamps. Needs bolo-speech[mlx].'
  source_url: https://huggingface.co/mlx-community/whisper-tiny-mlx
  validated: cpu
  measured:
    rtf: 18.1
    audio_s: 3.0
    engine: mlx 0.32.4 (Linux CPU wheel, mlx-cpu), mlx-whisper 0.4.3
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, load average about 20 from other work
    date: '2026-11-18'
    note: 'Through bolo''s HTTP API with device = coreml on a machine without Metal: placed on the CPU with a notice. en-short sample, transcript exact. MLX''s Linux CPU back end is far slower than on Apple silicon; not run on a Mac by the maintainers (the macOS CI job runs it).'
    metal:
      rtf: 0.0115
      audio_s: 146.3
      engine: mlx 0.32.4 (Metal), mlx-whisper 0.4.3
      hardware: Apple M4 Pro (20-core GPU), 24 GB, macOS 26.3.1
      date: '2026-11-19'
      note: 'Through bolo''s HTTP API with the device setting left at its default (placed on Metal): an English recording of 146 s, median of three warm runs, transcript checked.'
  source:
    repo: mlx-community/whisper-tiny-mlx
    revision: 6caf9c55601caafbe6508a8b0d216bdf4783c4e8
    include: [config.json, weights.npz]
