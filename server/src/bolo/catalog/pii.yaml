    threads: 4
    engine: onnxruntime 1.32.0
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, shared (load average about 20)
    date: '2026-11-18'
    test_text: "the English sentence (name, telephone, e-mail, card) and a German one (name, street, telephone): all found"
  options:
    file: model_fp16.onnx
  source:
