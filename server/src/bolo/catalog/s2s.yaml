  description: 'Liquid AI LFM3-Audio 2B from its ONNX graphs (4-bit language model), in this process with ONNX Runtime:
    no llama-server. As s2s_model it is the speech-to-speech model of Realtime sessions (English conversation with
    interleaved text and speech, tool calls); as a voice it speaks text in 18 languages with two voices, no cloning.
    Commercial use is conditional: licensed only to organisations under USD 10M yearly revenue. About 3.3 GB of
    memory; on 4 shared CPU cores speech is generated at about half the speed it is spoken, so it wants a faster
    CPU (8 or more cores) to keep up. Needs onnxruntime and tokenizers (pip install bolo-speech[s2s]).'
