  description: 'tiny-voca (Muhammed Nazeem, Apache-2.0): a 4.5 M-parameter English voice, F2 (female) or M2 (male), 24
    kHz, the authors'' ONNX export on ONNX Runtime, in process: no server, no PyTorch. Text to phonemes with the authors''
