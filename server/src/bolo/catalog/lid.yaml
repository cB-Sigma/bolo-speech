# Spoken-language identification (task: lid): which language a recording is in. Used by POST /v1/audio/language
# and by language routing (a transcription with model "auto" and no language goes to a recogniser for the language
# heard; bolo.lid, docs/api.md "Language identification and routing"). The runnable ones run in ONNX Runtime
# (bolo.engines.lid_onnx). Licences differ: MMS-LID and its fine-tunes are non-commercial, AmberNet is under
# NVIDIA's NGC Terms of Use.

