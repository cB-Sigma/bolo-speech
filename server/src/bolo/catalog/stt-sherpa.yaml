- id: whisper-large-v3-turbo
  aliases:
  - openai/whisper-large-v3-turbo
  - whisper-turbo
  task: stt
  engine: sherpa-onnx
  kind: whisper
  family: Whisper
  languages: *id001
  tier: accuracy
  size_bytes: 1036613791
  params: 809000000
  license: MIT
  features:
  - punctuation
  - translate
  - language-detect
  description: OpenAI Whisper turbo exported to ONNX (int8) for sherpa-onnx. Multilingual, including Hindi, Tamil,
    Marathi, Urdu and other Indian languages; set `language` for best results. Not recommended for Telugu and
    Bengali, where sherpa-onnx's greedy decoding falls into repeated syllables (faster-whisper's large-v3-turbo
    does not).
  source_url: https://github.com/openai/whisper
  validated: cpu
  measured:
    rtf: 0.3
    wer: 0.031
    audio_s: 23.3
    load_s: 2.62
    memory_mb: 1073
    threads: 4
    engine: sherpa-onnx 2.0.1
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU
    date: '2026-11-13'
    test_audio: csukuangfj/sherpa-onnx-whisper-turbo/test_wavs/0.wav
  source:
    repo: csukuangfj/sherpa-onnx-whisper-turbo
    revision: 2ca6ff69fc878651b770880507669577ac41c2ff
    include:
    - '*-encoder.int8.onnx'
    - '*-decoder.int8.onnx'
    - '*-tokens.txt'
    exclude:
    - espeak-ng-data/*
    - test_wavs/*
    - '*.md'
    - '*.sh'
    - '*.py'
    - .gitattributes
    - '*.wav'
    - '*.mp4'
    - '*.mov'
    - '*.srt'
  options:
    # the int8 decoder gives wrong text in some languages on x86 CPUs without AVX-512 VNNI (an AMD EPYC 7763:
    # Telugu, Bengali and Tamil turned to nonsense); there the float32 decoder (636 MB) is fetched and loaded
    float_decoder_without_vnni: '*-decoder.onnx'
    not_recommended_for:
      te: 'sherpa-onnx decodes Whisper greedily, with no fallback to a higher temperature: on FLEURS Telugu one
        utterance in six ran into a repeated syllable for its last third (character error rate 0.17 to 0.77);
        use faster-whisper-large-v3-turbo or an IndicConformer'
      bn: 'sherpa-onnx decodes Whisper greedily, with no fallback to a higher temperature: on FLEURS Bengali one
        utterance in six looped on a word and a letter for half its length and the others had character error
        rates of 0.28 to 0.59; use faster-whisper-large-v3-turbo or an IndicConformer'
