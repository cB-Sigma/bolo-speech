# Audio watermarkers: an inaudible mark on synthetic and cloned speech, and its detection (docs/api.md, "Watermarks").
- id: audioseal-16bits
  aliases: [audioseal, facebook/audioseal]
  task: watermark
  engine: onnxruntime
  kind: audioseal_onnx
  family: AudioSeal
  languages: []
  tier: realtime
  sample_rate: 16000
  size_bytes: 93481274
  license: MIT
  license_url: https://huggingface.co/facebook/audioseal
  commercial_use: true
  description: 'AudioSeal (Meta, MIT; code and weights), the 16-bit model: a generator that adds an inaudible,
    sample-level watermark carrying 16 bits, and a detector that finds it again, sample by sample, after cuts,
    resampling and lossy compression. ONNX export of the authors'' generator_base.pth and detector_base.pth by
    DarumaHQ (DarumaHQ/audioseal-onnx, export script and parity results published); bolo checked it against the
    PyTorch original in both directions (embedded by one, detected by the other: same payload, every sample marked,
    detector scores within 1e-6). Runs on ONNX Runtime: no PyTorch.'
  source_url: https://github.com/facebookresearch/audioseal
  validated: untested
  source:
    repo: DarumaHQ/audioseal-onnx
    revision: 55477a4c93a98fd9c38f59173d506c7e9a803589
    include: [audioseal_generator_16bits.onnx, audioseal_detector_16bits.onnx, LICENSE]
  options:
    generator: audioseal_generator_16bits.onnx
    detector: audioseal_detector_16bits.onnx
    window_s: 10

- id: perth-onnx
  aliases: [perth, resemble-perth]
  task: watermark
  engine: onnxruntime
  kind: perth_onnx
  family: Perth
  languages: []
  tier: realtime
  sample_rate: 32000
  size_bytes: 56142402
  license: MIT
  license_url: https://github.com/resemble-ai/Perth/blob/master/LICENSE
  commercial_use: true
  description: 'Perth (Resemble AI, MIT), the implicit watermarker of the resemble-perth package: an imperceptible mark
    in the spectrum below 2 kHz, found again from a stretch of audio. Carries no payload: a clip is marked or not.
    ONNX export with the STFT and inverse STFT inside the graphs (codebucketsolutions/perth-onnx), checked against the
    PyTorch original both ways: embedded audio within 5.4e-7, scores the same.'
  source_url: https://github.com/resemble-ai/Perth
  validated: cpu
  measured:
    rtf: 0.033
    audio_s: 11.8
    threads: 4
    engine: onnxruntime
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, shared with other jobs
    note: 'detection; marking 0.024. Found on every marked clip and no unmarked one, also after MP3, Opus and 16 or
      8 kHz resampling'
    date: '2026-11-18'
  source:
    repo: codebucketsolutions/perth-onnx
    revision: 1c22fd5ff7c3a5a5d9091a02175bf7e7a1d7970d
    include: [perth_embed.onnx, perth_detect.onnx, LICENSE]
  options:
    embedder: perth_embed.onnx
    detector: perth_detect.onnx
    window_s: 2

- id: wavmark-onnx
  aliases: [wavmark, M4869/WavMark]
  task: watermark
  engine: onnxruntime
  kind: wavmark_onnx
  family: WavMark
  languages: []
  tier: realtime
  sample_rate: 16000
  size_bytes: 26609306
  license: MIT
  license_url: https://huggingface.co/M4869/WavMark
  commercial_use: true
  description: 'WavMark (Chen et al., MIT): 32 bits in each second of audio, 16 of them a fixed pattern that finds the
    mark and 16 the payload, one second in every 1.1 s, decoded wherever it starts (searched every 50 ms). Marks only
    whole seconds: a stretch shorter than 1.1 s is left unmarked. ONNX export (codebucketsolutions/wavmark-onnx) of
    the checkpoint of M4869/WavMark, checked against the PyTorch original both ways: every bit decoded the same.'
  source_url: https://huggingface.co/M4869/WavMark
  validated: cpu
  measured:
    rtf: 2.3
    audio_s: 4.1
    threads: 4
    engine: onnxruntime
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, shared with other jobs
    note: 'marking (about 2.3 s per second of audio); detecting a marked clip about 2.8 s per second, an unmarked one
      up to 6 s per second (it searches every 50 ms). Found on every marked clip with all 16 bits right and no
      unmarked one, also after MP3, Opus and 16 or 8 kHz resampling'
    date: '2026-11-18'
  source:
    repo: codebucketsolutions/wavmark-onnx
    revision: 4eb7998f31a20707bb5b4359c88597ef19468520
    include: [wavmark_embed.onnx, wavmark_detect.onnx, LICENSE]
  options:
    embedder: wavmark_embed.onnx
    detector: wavmark_detect.onnx
