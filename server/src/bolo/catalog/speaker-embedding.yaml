# Speaker embedders on their own (task speaker-embedding): one vector per stretch of speech; the cosine of two is how
# alike the voices sound. Any of them can score cloned voices (setting voice_similarity_model) and answer
# POST /v1/audio/speech/embedding (model); diarization entries carry an embedder of their own.
# * sherpa-onnx runs the exports csukuangfj/speaker-embedding-models publishes (with the metadata sherpa-onnx reads).
#   ERes2Net, TitaNet-small and WeSpeaker ResNet34 are the very files of the pyannote-3.0-* diarization entries.
# * ECAPA-TDNN from SpeechBrain runs in ONNX Runtime directly (bolo.engines.speaker_embedding): a third-party export
#   whose graph takes the waveform (SpeechBrain's filterbank front-end is inside it).
# Every file is pinned by sha256.

