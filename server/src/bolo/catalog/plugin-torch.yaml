# Models that need PyTorch. bolo itself never imports PyTorch: these run on an out-of-process engine plugin
# (engine: plugin:torch, docs/plugins.md) that is installed separately. Until it is installed they are listed with
# requires: [plugin:torch] and available: false. None of them was run by the bolo maintainers.
- id: indic-parler-tts
  task: tts
  engine: plugin:torch
  kind: parler-tts
  family: Parler-TTS
  languages: [as, bn, en, gu, hi, kn, ks, ml, mr, ne, or, pa, sa, sd, ta, te, ur]
  tier: accuracy
  sample_rate: 44100
  size_bytes: 3763425337
  params: 900000000
  license: Apache-2.0
  gated: true
  description: 'AI4Bharat Indic Parler-TTS: text-to-speech for 20+ Indian languages with the voice described in words
    ("a calm female voice, close to the microphone"). Gated: accept the terms on the model page and set HF_TOKEN.
    Needs PyTorch, so it runs on the torch engine plugin.'
  source_url: https://huggingface.co/ai4bharat/indic-parler-tts
  validated: untested
  source:
    repo: ai4bharat/indic-parler-tts
    revision: 660bc53c64ae83150613264111708a0465211237
  options:
    plugin_install: the bolo PyTorch engine plugin (plugins/bolo-torch in the bolo repository; not published yet)
