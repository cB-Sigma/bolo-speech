# Models that need PyTorch. bolo itself never imports PyTorch: these run on the out-of-process engine plugin
# bolo-torch (engine: plugin:torch, plugins/bolo-torch, docs/plugins.md), which is installed separately, per model
# family: pip install "bolo-torch[parler]" / "[f5]" / "[orpheus]" / "[sepformer]" / "[pyannote]". Until it is installed these
# entries are listed with requires: [plugin:torch] and available: false, and using one answers 424 with the
# install hint in options.plugin_install.
