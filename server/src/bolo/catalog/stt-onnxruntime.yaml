# Recognisers run by ONNX Runtime directly (bolo.engines.dicow_onnx), without PyTorch.
#
# dicow-v3.3-onnx is bolo's own ONNX export of BUT-FIT/DiCoW_v3_3 (server/tools/export_dicow_onnx.py), published at
# codebucketsolutions/dicow-v3.3-onnx (docs/models.md, "DiCoW without PyTorch"). A local export registered with
# `bolo pull ./dir` gets the same features and options as this entry.
- id: dicow-v3.3-onnx
  aliases: [dicow-onnx]
  task: stt
  engine: onnxruntime
  kind: dicow_onnx
  family: DiCoW
  languages: [en]
  tier: accuracy
  sample_rate: 16000
  size_bytes: 1534553273
  params: 809000000
  license: CC-BY-4.0
  license_url: https://huggingface.co/BUT-FIT/DiCoW_v3_3
  commercial_use: true
  features: [timestamps, speaker-conditioned]
  description: 'BUT-FIT DiCoW v3.3 (Whisper large-v3-turbo conditioned on speaker diarization) in ONNX Runtime, int8,
    without PyTorch. For diarized transcription (diarize=true) it decodes the whole recording once per speaker, told
    frame by frame whether that speaker, someone else, both or nobody is talking: overlapping speech is transcribed
    for each speaker. Same decoding as dicow-v3.3 on the torch plugin. Trained on English meetings and mixtures (AMI,
    NOTSOFAR-1, LibriMix). CC-BY-4.0: credit BUT Speech@FIT and cite the DiCoW papers (see the model card).'
  source_url: https://huggingface.co/BUT-FIT/DiCoW_v3_3
  validated: cpu
  measured:
    rtf: 0.725
    audio_s: 180.0
    memory_mb: 4700
    threads: 4
    engine: onnxruntime 1.31.1, numpy, int8 graphs
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz, AMX), no GPU
    date: '2026-11-14'
    note: 'Diarized transcription with nemotron-3-diarization, RTF including diarization, four 45 s AMI excerpts
      with 3-4 speakers on a shared machine (1.01 at 2 threads; memory is the whole process with the diarizer).
      cpWER on 24 AMI far-field excerpts 26.0 %, the same as dicow-v3.3 on the torch plugin (7 files better, 7
      worse); on 44 synthetic two-voice mixes 7.8 % against 6.6 %. Measured on a local export; the published
      files have the same SHA-256 sums. docs/measurements/dicow-onnx.json.'
  source:
    repo: codebucketsolutions/dicow-v3.3-onnx
    revision: dd5db868e037d00e587a7f4ee56865f6c1817c3c
    include: [encoder.int8.onnx, encoder.int8.onnx.data, decoder.int8.onnx, decoder.int8.onnx.data, '*.json', README.md]
  options:
    diarization_model: nemotron-3-diarization
    conditioning: turns
- id: canary-qwen-2.5b-onnx
  aliases:
  - nvidia/canary-qwen-2.5b
  - OpenVoiceOS/canary-qwen-2.5b-onnx
  task: stt
  engine: onnxruntime
  kind: canary_qwen_onnx
  family: Canary-Qwen
  languages:
  - en
  tier: accuracy
  size_bytes: 2896879730
  params: 2500000000
  license: CC-BY-4.0
  license_url: https://huggingface.co/nvidia/canary-qwen-2.5b
  features:
  - punctuation
  description: 'NVIDIA Canary-Qwen 2.5B without NeMo or PyTorch: a FastConformer encoder feeding Qwen3-1.7B, which
    writes the transcript (English only, with punctuation and capitals; at the top of the Open ASR Leaderboard for
    English when it was released). Int8 ONNX export by OpenVoiceOS (not by NVIDIA), run by bolo in ONNX Runtime with
    greedy decoding. No word timestamps; audio is decoded in pieces of up to 30 s. Slow on a CPU (2.9 GB). CC-BY-4.0:
    credit NVIDIA.'
  source_url: https://huggingface.co/nvidia/canary-qwen-2.5b
  validated: cpu
  measured:
    rtf: 3.194
    wer: 0.0
    audio_s: 11.8
    load_s: 21.65
    memory_mb: 4908
    threads: 4
    engine: onnxruntime 1.32.0
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU
    date: '2026-11-21'
    test_audio: bolo's en-long sample (English, Kokoro, 11.8 s)
    note: 'Through bolo (core.transcribe): word for word, punctuation and capitals included. Slower than real time
      on this CPU (greedy decoding, one decoder run per token, 4.9 GB of memory); the machine was shared and running
      a test suite at the same time (load average 5-7).'
  source:
    repo: OpenVoiceOS/canary-qwen-2.5b-onnx
    revision: f3cbcb0c971147ecc81ad6450be9a334bf58ca34
    include:
    - encoder_int8.onnx
    - embed_tokens_int8.onnx
    - decoder_int8.onnx
    - config.json
    - vocab.json
