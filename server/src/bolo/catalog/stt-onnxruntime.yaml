# Recognisers run by ONNX Runtime directly (bolo.engines.dicow_onnx), without PyTorch.
#
# dicow-v3.3-onnx is bolo's own ONNX export of BUT-FIT/DiCoW_v3_3 (server/tools/export_dicow_onnx.py). It stays
# `status: pending` until the export is hosted (docs/models.md, "DiCoW without PyTorch"); until then a local export
# is registered with `bolo pull ./dir`, which gives it the same features and options as this entry.
- id: dicow-v3.3-onnx
  aliases: [dicow-onnx]
  task: stt
  engine: onnxruntime
  kind: dicow_onnx
  family: DiCoW
  languages: [en]
  tier: accuracy
  sample_rate: 16000
  size_bytes: 1534553273
  params: 809000000
  license: CC-BY-4.0
  license_url: https://huggingface.co/BUT-FIT/DiCoW_v3_3
  commercial_use: true
  features: [timestamps, speaker-conditioned]
  description: 'BUT-FIT DiCoW v3.3 (Whisper large-v3-turbo conditioned on speaker diarization) in ONNX Runtime, int8,
    without PyTorch. For diarized transcription (diarize=true) it decodes the whole recording once per speaker, told
    frame by frame whether that speaker, someone else, both or nobody is talking: overlapping speech is transcribed
    for each speaker. Same decoding as dicow-v3.3 on the torch plugin. Trained on English meetings and mixtures (AMI,
    NOTSOFAR-1, LibriMix). CC-BY-4.0: credit BUT Speech@FIT and cite the DiCoW papers (see the model card).'
  source_url: https://huggingface.co/BUT-FIT/DiCoW_v3_3
  validated: untested
  status: pending
  source:
    repo: codebucketsolutions/dicow-v3.3-onnx
    include: [encoder.int8.onnx, encoder.int8.onnx.data, decoder.int8.onnx, decoder.int8.onnx.data, '*.json', README.md]
  options:
    diarization_model: nemotron-3-diarization
    conditioning: turns
