# Voice conversion: speech in, the same words out in another voice (POST /v1/audio/voice-conversion).
# All run on audio.cpp (task vc), from the audio.cpp GGUF repository pinned to one commit.
- id: openvoice-v2-tone-color-audiocpp
  task: voice-conversion
  engine: tts-server
  kind: tts-server
  family: OpenVoice v2 tone colour converter
  languages: []
  tier: realtime
  sample_rate: 22050
  size_bytes: 65644736
  license: MIT
  license_url: https://huggingface.co/myshell-ai/OpenVoiceV2
  commercial_use: true
  gated: false
  features: []
  description: 'OpenVoice v2''s tone colour converter (MyShell, MIT) on audio.cpp (tone_color_vc): keeps the words,
    rhythm and intonation of the source and gives them the timbre of the target recording. Any language. Small (66 MB,
    F16) and quick on a CPU. Needs a recording of the target voice (a saved voice, a reference clip or reference_audio).
    Runs in an audiocpp_server that bolo starts (bolo components install audio.cpp) or one on this machine.'
  source_url: https://huggingface.co/myshell-ai/OpenVoiceV2
  validated: cpu
  measured:
    rtf: 2.93
    audio_s: 11.8
    threads: 4
    engine: audio.cpp (built from source, 2026-11-18)
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, shared with other jobs
    note: 'en-long clip (male) to the en-short voice (female): pitch 115 -> 188 Hz, words kept (moonshine-tiny-en transcript); time includes loading'
    date: '2026-11-18'
  requires: [audio.cpp]
  source:
    repo: audio-cpp/audio.cpp-gguf
    revision: ca0b203eb1bb87f333a7cfbad2d5f6672b4ccba7
    subdir: Tone-Color-VC-GGUF
    include: [tone-color-vc-f16.gguf]
  options:
    runtime: audio.cpp
    family: tone_color_vc
    server_model: openvoice-v2-tone-color-audiocpp
    hardware: {gpu: optional, vram_gb: 0.6, note: 'approximate: weights x 1.3 + 0.5 GB'}

