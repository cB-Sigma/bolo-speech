- id: rvc-audiocpp
  task: voice-conversion
  engine: tts-server
  kind: tts-server
  family: RVC
  languages: []
  tier: balanced
  sample_rate: 48000
  size_bytes: 1260187648
  license: MIT (base models); packaged voices without a stated licence
  license_url: https://huggingface.co/lj1995/VoiceConversionWebUI
  commercial_use: false
  gated: false
  features: []
  description: 'RVC (retrieval-based voice conversion; HuBERT content features and RMVPE pitch, MIT) on audio.cpp
    (rvc), F16 (1.3 GB). Converts to one of its packaged voices (voice default, manthos, chocola or fraise), not to a
    recording. The base models are MIT; the packaged voices have no documented source or licence, so treat it as
    not cleared for commercial use. Runs in an audiocpp_server that bolo starts (bolo components install audio.cpp)
    or one you run (setting tts_servers).'
  source_url: https://huggingface.co/lj1995/VoiceConversionWebUI
  validated: cpu
  measured:
    rtf: 6.19
    audio_s: 11.8
    threads: 4
    engine: audio.cpp (built from source, 2026-11-18)
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, shared with other jobs
    note: 'en-long clip to the packaged voice chocola, no pitch shift: words kept (moonshine-tiny-en transcript), 48 kHz
      out; time includes loading'
    date: '2026-11-18'
  requires: [audio.cpp]
  source:
    repo: audio-cpp/audio.cpp-gguf
    revision: ca0b203eb1bb87f333a7cfbad2d5f6672b4ccba7
    subdir: RVC-GGUF
    include: [rvc-f16.gguf]
  options:
    runtime: audio.cpp
    family: rvc
    server_model: rvc-audiocpp
    vc_voices: true
    hardware: {gpu: optional, vram_gb: 2.1, note: 'approximate: weights x 1.3 + 0.5 GB'}
  voices:
  - {id: default, name: Default (packaged)}
  - {id: manthos, name: Manthos (packaged)}
  - {id: chocola, name: Chocola (packaged)}
  - {id: fraise, name: Fraise (packaged)}

