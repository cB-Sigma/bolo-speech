    audio_s: 12.8
    load_s: 0.0
    memory_mb: 0
    threads: 1
    engine: livekit 1.3.0
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.30GHz), no GPU, load average about 20
    date: '2026-11-18'
    erle_db: 33.0
    near_level_db: -6.1
- id: dtln-aec-128
  aliases: [dtln-aec, dtln]
  task: echo-cancellation
  engine: onnxruntime
  kind: dtln_aec
  family: DTLN-aec
  languages: []
  tier: realtime
  sample_rate: 16000
  size_bytes: 7289725
  params: 1800000
  license: MIT
  license_url: https://github.com/breizhn/DTLN-aec/blob/main/LICENSE
  description: 'DTLN-aec with 128 LSTM units (Westhausen and Meyer, 2021), a recurrent network trained for the
    Microsoft AEC Challenge: a spectral mask, then a time-domain stage, both given the reference. Keeps the most of
    the user''s voice when both talk at once, removes less echo than the signal-processing cancellers, and costs
    more CPU (about a quarter of a core). Weights MIT; the hosting repository also holds anarlog''s GPL-3.0 licence
    file, which covers anarlog''s code.'
  source_url: https://github.com/breizhn/DTLN-aec
  validated: cpu
