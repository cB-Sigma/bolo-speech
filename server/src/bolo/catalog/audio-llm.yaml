  commercial_use: false
  gated: false
  features: [audio-in]
  description: 'Liquid''s LFM2.5-Audio 1.5B hearing speech (English), the smallest model here (4-bit weights and audio
    encoder, 0.9 GB). Upstream llama.cpp runs its audio input only (marked experimental by llama.cpp); the model''s
    own speech output needs Liquid''s separate runner and is not used. Ran here through bolo''s managed llama-server:
    it transcribed the question instead of answering it, even when told to answer, so it is a weak choice for the
    audio-llm pipeline. Commercial use is conditional: licensed only to organisations under USD 10M yearly revenue,
    treated here as non-commercial.'
  source_url: https://huggingface.co/LiquidAI/LFM2.5-Audio-1.5B
  validated: untested
  measured:
    engine: llama.cpp b12375 llama-server (upstream release build, CPU), started by bolo
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU
    threads: 4
    date: '2026-11-17'
    note: 'bolo''s managed llama-server (audio_llm_model), en-short.wav (3 s, "Good morning. Could you tell me when my
      order will arrive?"): with "Perform ASR." the sentence back; with a shop-assistant system prompt asking for an
      answer, the sentence back again ("Good morning! Could you tell me when my order will arrive?"). First token 59
      to 84 s, the whole reply 153 to 184 s, on a machine with a load of 11 to 18 from other jobs: not representative
      of the model''s speed.'
