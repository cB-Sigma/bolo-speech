# Audio-in language models for the Realtime `audio-llm` pipeline (task audio-llm): the model hears the user's turn
# (input_audio in /v1/chat/completions) and writes the answer, which bolo's TTS speaks. bolo runs them on llama.cpp's
# server (bolo.audio_llm: `audio_llm_model = "<id>"` without audio_llm_base_url; bolo components install
# llama-server), with the language model (-m) and its audio encoder (-mm). None of them speaks through llama-server:
# llama.cpp has no audio output for these models, so they are not speech-to-speech models here.
# Sources, read 2026-11-17: the model cards, the Hugging Face API for every file (size, revision, SHA-256), and
# llama.cpp build b12375 (libmtmd has the projectors ultravox, qwen2.5o, qwen3a, lfm2a and gemma4a; the GGUF headers
# of these mmproj files say clip.has_audio_encoder = true).
