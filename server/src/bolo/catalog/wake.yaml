# Wake words and keyword spotting (task wake-word): POST /api/v1/wake, WS /api/v1/wake/stream, the Wyoming wake
# service, bolo wake (docs/api.md, "Wake words"). bolo.wake runs them.
# * sherpa-onnx keyword spotters (k2-fsa, Apache-2.0): streaming Zipformer transducers trained to find phrases
#   given as text. The GigaSpeech one spells English as BPE pieces (any word; custom phrases need sentencepiece,
#   pip install 'bolo-speech[wake]'); the Chinese-English one spells English from its own lexicon and Chinese as
#   pinyin (custom Chinese phrases need pypinyin). The phrases they listen for by default are spelled below.
# * openWakeWord (David Scripka): the melspectrogram and embedding models are Apache-2.0; the pretrained phrase
#   models are CC BY-NC-SA 4.0 (non-commercial; they were trained partly on data with such terms). Files from the
#   v0.5.1 release on GitHub.
# * microWakeWord (Kevin Ahrendt, for ESPHome; Apache-2.0): TensorFlow Lite models made for microcontrollers. The
#   pymicro-wakeword package (Apache-2.0, pip install 'bolo-speech[wake]') carries the four models and TensorFlow
#   Lite's runtime: nothing is downloaded, the package version is the pin.
# Measured on CPU (one thread, on a loaded machine) on Piper (lessac, low) saying "Okay Nabu, set a timer for ten
# minutes.", "Hey Jarvis, what is the weather like today?", "Alexa, turn on the lights in the kitchen.", "Hey
# Mycroft, play some music.", "Hey bolo, what time is it?" and a sentence with no wake word, and on the two English
# samples (37 s with the pauses around each): what each found is in its description. No false detection anywhere.

