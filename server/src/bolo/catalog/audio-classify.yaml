# Zero-shot audio classification (task audio-classify): the caller names the classes in plain words ("angry
# voice", "hold music", "a dog barking") and gets a score per label, from CLAP models (contrastive language-audio
# pretraining: an audio tower and a text tower in one embedding space). Used by POST /v1/audio/classify, which also
# serves classifiers trained from examples on these models' audio embeddings (bolo.classifiers).
# All run on ONNX Runtime (bolo.engines.clap_onnx) from bolo's own exports (codebucketsolutions/*-onnx on Hugging
# Face, made with server/tools/export_clap_onnx.py): the audio tower with its log-mel front end inside the graph,
# the text tower, and the tokenizer. Each export was checked against the PyTorch original (the model cards and
# parity.json have the numbers). The entries use the audio tower with int8 weights (about three times faster on a
# CPU than full precision, the same top label on every test clip) and the full-precision text tower (int8 moves
# text embeddings too far; label embeddings are cached anyway). No PyTorch needed.
# * LAION CLAP (LAION, Apache-2.0 as published in transformers; the original LAION-AI/CLAP code and checkpoints
#   are CC0-1.0): HTSAT audio encoder, RoBERTa text encoder, 48 kHz, 10 s at once. laion/larger_clap_music is not
#   here: as published in transformers its logit scale is 1.03 and its label scores come out uniform (1/15 for 15
#   labels, in PyTorch as in ONNX).
# * MS-CLAP 2023 (Microsoft, MS-PL): HTSAT audio encoder, GPT-2 text encoder, 44.1 kHz, 7 s at once.

- id: clap-htsat-unfused
  aliases: [laion/clap-htsat-unfused, laion-clap, clap]
  task: audio-classify
  engine: onnxruntime
  kind: clap_onnx
  family: LAION CLAP
  languages: [en]
  tier: realtime
  sample_rate: 48000
  size_bytes: 541983379
  params: 155000000
  license: Apache-2.0
  license_url: https://huggingface.co/laion/clap-htsat-unfused
  features: [zero-shot, embeddings, music, sound-events]
  description: 'LAION CLAP with the HTSAT-tiny audio encoder (the transformers "clap-htsat-unfused" checkpoint,
    trained on LAION-Audio-630K): zero-shot audio classification against labels in plain English, and audio
    embeddings for classifiers trained here. The default. ONNX export (codebucketsolutions/clap-htsat-unfused-onnx)
    checked against the PyTorch original: full precision within 1.1e-5 on every audio embedding; the int8 audio tower
    used here within 0.014 on label probabilities, same top label on every test clip.'
  source_url: https://github.com/LAION-AI/CLAP
  validated: cpu
  measured:
    rtf: 0.2622
    audio_s: 37.0
    load_s: 14.45
    memory_mb: 747
    threads: 4
    engine: onnxruntime 1.32.0
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, load average about 12
    note: 'zero-shot against 14 labels on the three speech samples and three synthetic clips (music, white noise, a
      tone); the text tower took 1.2 s for the 14 labels, then they came from the cache. A
      classifier trained on its embeddings of 8 speech, 8 music and 8 noise clips: cross-validated accuracy
      100%, 29 s to embed the clips, 0.30 s to train'
    date: '2026-11-21'
  source:
    repo: codebucketsolutions/clap-htsat-unfused-onnx
    revision: 59c01294eefe1dec2978aebbd6494c7eb1def888
    include: [audio.int8.onnx, text.onnx, tokenizer.json, clap.json, LICENSE]
  options:
    audio: audio.int8.onnx
    text: text.onnx

