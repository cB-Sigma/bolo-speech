    decides once a second whether to speak, and talks while it keeps listening (its as_duplex() API), English and Chinese,
    voice from a reference recording (three of the model''s own: ht, system, system-2); the session''s instructions are
    its system prompt. Vision is not used. Its model code is remote code: it runs only after you opt in (bolo models config
    minicpm-o-4.5 --set allow_remote_code=true), checked file by file. Runs in bolo''s small server on OpenBMB''s code (bolo
    components install minicpm-o; NVIDIA GPU). Apache-2.0. About a second of latency by design.'
