# Sound event detection and audio tagging (task audio-tagging): which sounds a recording holds (speech, music,
# laughter, a dog, a siren, an engine, ...), each of AudioSet's 527 classes with its own probability. Used by
# POST /v1/audio/tags (also over time, window by window). All run on sherpa-onnx (bolo.engines.audio_classify)
# from the exports k2-fsa publishes; the class names are AudioSet's ontology (CC BY 4.0, Google), shipped with
# each model as class_labels_indices.csv.
# * CED (Consistent Ensemble Distillation, Heinrich Dinkel et al., Xiaomi): ViT audio transformers distilled from
#   an ensemble, Apache-2.0 (github.com/RicherMans/CED). tiny, mini, small and base, int8.
# * Zipformer audio taggers from icefall (k2-fsa, Apache-2.0), trained on AudioSet, int8.

- id: ced-tiny
  aliases: [k2-fsa/sherpa-onnx-ced-tiny-audio-tagging-2024-04-19, mispeech/ced-tiny]
  task: audio-tagging
  engine: sherpa-onnx
  kind: audio_tagging
  family: CED
  languages: []
  tier: realtime
  sample_rate: 16000
  size_bytes: 6148092
  params: 5500000
  license: Apache-2.0
  license_url: https://github.com/RicherMans/CED/blob/main/LICENSE
  features: [music, sound-events]
  description: CED tiny (Xiaomi), the smallest AudioSet tagger here (5.5 M parameters, int8, 6 MB) - 527 sound
    classes, speech and music among them. The one the browser demo runs.
  source_url: https://github.com/RicherMans/CED
  validated: cpu
  measured:
    rtf: 0.034
    audio_s: 118.2
    load_s: 0.68
    threads: 4
    engine: sherpa-onnx 2.0.1
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.30GHz), no GPU, load average about 21
    date: '2026-11-18'
  source:
    repo: k2-fsa/sherpa-onnx-ced-tiny-audio-tagging-2024-04-19
    revision: efe3a5cfad74e56598d855d055006903adc00e38
    include: [model.int8.onnx, class_labels_indices.csv]
  options:
    arch: ced
    model: model.int8.onnx
