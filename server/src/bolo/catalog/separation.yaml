# Overlapped-speech separation (task: separation), used by `separate_overlaps` on diarized transcription.

- id: voxlock-int8
  aliases: [voxlock]
  task: separation
  engine: sherpa-onnx
  kind: voxlock
  family: VoxLock
  languages: [en]
  tier: balanced
  sample_rate: 16000
  size_bytes: 80934980
  params: 27000000
  license: Apache-2.0
  license_url: https://huggingface.co/arbazsiddiqui/voxlock/blob/main/LICENSE
  description: 'Target-speaker extraction (VoxLock, a causal band-split RNN): keeps one voice of a mixture given
    3 s of that voice, which bolo takes from the speaker''s own speech outside overlaps. Runs in sherpa-onnx 2.0.1+
    (int8 chunk model plus enrolment model). Trained on English (LibriSpeech and AMI); a 2026 model from a single
    author, so judge it by the measurements in docs/models.md ("Overlapping speech") rather than its model card.
    Internally 16 kHz; it did not help on telephone (8 kHz) audio in our tests.'
  source_url: https://huggingface.co/arbazsiddiqui/voxlock
  validated: cpu
  measured:
    rtf: 0.46
    rtf_note: seconds of CPU per second of window audio and speaker, plus about 1.9 s per enrolled speaker
    cpwer_rel_gain: 0.204
    audio_s: 2015.3
    threads: 2
    engine: sherpa-onnx 2.0.1
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, shared (load average 4-7)
    date: '2026-11-13'
    test_audio: 60 synthetic two-voice English mixes at 16 kHz (docs/measurements/overlap-separation.json)
  source:
    urls:
    - path: sherpa-onnx-voxlock-int8.tar.bz2
      url: https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/sherpa-onnx-voxlock-int8.tar.bz2
      size: 72508647
      sha256: bcb947f9e8676d3e963f6048b0088505c84f0843bfdc88cb26dde3264d81570b
      extract: true
  options:
    enroll_model: enroll.onnx
    chunk_model: chunk_int8.onnx

# SepFormer in ONNX Runtime (bolo.engines.speechbrain_onnx): SpeechBrain's checkpoints exported unchanged by
# server/tools/export_speechbrain_onnx.py and published under codebucketsolutions/ with their parity checks.
# The WHAMR! SepFormers run on the torch plugin (plugin-torch.yaml).
- id: sepformer-wsj02mix
  task: separation
  engine: onnxruntime
  kind: sepformer_onnx
  family: SepFormer
  languages: [en]
  tier: balanced
  sample_rate: 16000
  size_bytes: 106064377
  license: Apache-2.0
  license_url: https://huggingface.co/speechbrain/sepformer-wsj02mix
  description: 'SpeechBrain SepFormer trained on WSJ0-2mix (8 kHz, clean read English): blind separation of two
    overlapping voices, used by separate_overlaps. bolo hands it 16 kHz audio, resampled to 8 kHz and back.
    SpeechBrain reports 22.4 dB SI-SNRi on the WSJ0-2mix test set. Runs in ONNX Runtime without PyTorch (an unchanged
    export of the weights, codebucketsolutions/sepformer-wsj02mix-onnx). Weights Apache-2.0; WSJ0-2mix is built from
    WSJ0 (LDC93S6A, Linguistic Data Consortium licence): a provenance risk for commercial use. Slower than real time
    on CPU.'
  source_url: https://huggingface.co/speechbrain/sepformer-wsj02mix
  validated: cpu
  measured:
    rtf: 3.507
    load_s: 0.8
    audio_s: 13.15
    memory_mb: 610
    threads: 2
    engine: onnxruntime 1.32.0
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU, shared (load average 13-14)
    date: '2026-11-21'
    test_audio: bolo samples en-long, en-short and hi-short mixed two and three at a time (3.0-4.1 s each)
    note: 'Synthetic equal-power mixtures of bolo''s three sample voices (en-long male, en-short and hi-short female;
      all starting together, 16 kHz), references band-limited to 8 kHz, best permutation. Mean SI-SNR improvement per
      two-voice mix: en-long m + en-short f +4.9 dB; en-long m + hi-short f +7.3 dB; en-short f + hi-short f +3.7 dB;
      three voices: +0.6 dB (per voice +0.9, -0.2, +1.2) from the two-speaker model''s two tracks. The ONNX graph
      matches SpeechBrain''s PyTorch model (parity.json in the repository).'
  source:
    repo: codebucketsolutions/sepformer-wsj02mix-onnx
    revision: cc60bde1bb1117aa6304e0217d82b5f57b53900d
    include: [sepformer.onnx, speechbrain_onnx.json]
  options:
    model_sample_rate: 8000
    speakers: 2
