# Decision models (task decision): typed questions about a recording, a text or both, answered from the model's
# distribution over the options, with no text generated (bolo.decide; POST /v1/audio/decisions, bolo decide). They
# run on llama.cpp's server (kind llama-decision of the tts-server engine, bolo.engines.decision_llamacpp), which
# serves them on POST /v1/systemone; bolo starts it (bolo components install llama-server) or uses one you run
# (setting tts_servers). Sources, read 2026-11-21: Liquid's model card, the LICENSE, the Hugging Face API (sizes,
# revision) and llama.cpp b12521 (libmtmd has the d1omni_a and d1omni_v projectors; the server answers a decision
# model's /v1/chat/completions with 501 and serves /v1/systemone).
- id: d1-omni-600m-llamacpp
  aliases: [d1-omni-600m, d1-omni]
  task: decision
  engine: tts-server
  kind: llama-decision
  family: d1-omni
  languages: [en]
  tier: realtime
  sample_rate: 16000
  size_bytes: 669998816
  params: 587000000
  license: LFM Open License v1.0
  license_url: https://huggingface.co/LiquidAI/d1-omni-600M-GGUF/blob/8eb2d2a1c5404bba8a34a88bd8e159c242197d51/LICENSE
  commercial_use: false
  gated: false
  features: [audio-in]
  description: 'Liquid d1-omni-600M (587 M parameters: an LFM2.5 encoder trunk with a decision head, a FastConformer
    audio encoder and a SigLIP2 vision encoder): answers yes/no, choice and score questions about up to 30 s of
    speech and a text, in one pass, without generating text. Its speech training was English requests to an
    assistant (what kind of utterance, its topic, what the speaker wants). Q8_0 weights and encoders from Liquid
    (0.67 GB) on llama.cpp, in a llama-server that bolo starts or one you run (setting tts_servers). Commercial use
    is conditional: the LFM Open License allows it only to organisations under USD 10M yearly revenue (non-profits
    for research too), so it is treated here as non-commercial.'
  source_url: https://huggingface.co/LiquidAI/d1-omni-600M
  validated: untested
  measured:
    audio_s: 3.0
    engine: llama.cpp b12521 llama-server (upstream release build, CPU), started by bolo
    hardware: 4 vCPU x86_64 (Intel(R) Xeon(R) Processor @ 2.10GHz), no GPU
    threads: 4
    date: '2026-11-21'
    note: 'Through bolo (bolo decide and POST /v1/audio/decisions) on bolo''s samples, four questions each (kind of
      utterance, topic, politeness, urgency): en-short ("Good morning. Could you tell me when my order will
      arrive?") a question (0.99) about a delivery (0.99); en-long (a talk about speech servers, 11.8 s) a speech
      (to an audience); a text refund request was one (yes, 1.00) from an unhappy customer (happy: 0.07). Times not
      representative: with the machine at a load of 11 to 17 from other jobs a warm request took 77 to 138 s, and
      the same request sent straight to llama-server 32 s; on a quieter moment, llama-server alone answered three
      questions about en-short in 2.7 s.'
  requires: [llama-server]
  source:
    repo: LiquidAI/d1-omni-600M-GGUF
    revision: 8eb2d2a1c5404bba8a34a88bd8e159c242197d51
    include: [d1-omni-600M-Q8_0.gguf, mmproj-d1-omni-600M-Q8_0.gguf]
  options:
    runtime: llama-server
    model_file: d1-omni-600M-Q8_0.gguf
    mmproj_file: mmproj-d1-omni-600M-Q8_0.gguf
    # a d1-omni prompt is evaluated in one batch: it must fit in -ub (Liquid's README: 4096 holds any image and a
    # state of a few thousand tokens)
    server_args: ['-b', '4096', '-ub', '4096']
    max_audio_s: 30.0
    queue_timeout_s: 0
    hardware: {gpu: optional, ram_gb: 1.5, note: 'built for CPUs and phones'}
# Cloudflare Clef-Omni through the torch plugin: transformers' Qwen3-Omni thinker and the repository's own
# joint_schema_model.py (remote code, pinned). Not on llama.cpp: b12521's decision server has the dense clef only, and
# the clef_omni architecture is an unmerged branch (a community GGUF, gecBurton/clef-omni-gguf, needs that fork).
- id: clef-omni
  task: decision
  engine: plugin:torch
  kind: clef-omni
  family: Clef-Omni
  languages: [en]
  tier: accuracy
  sample_rate: 16000
  size_bytes: 70755879415
  params: 30000000000
  license: Apache-2.0
  license_url: https://huggingface.co/Cloudflare/clef-omni/blob/189097bdeaaaea246bd876310d4ae30f9a50415a/LICENSE
  commercial_use: true
  gated: false
  features: [audio-in]
  description: 'Cloudflare Clef-Omni (Qwen3-Omni 30B-A3B''s thinker, post-trained, with a joint head that scores every
    option of every question at once): yes/no, choice and score questions about a text and a recording, in one pass,
    without generating text. Through the torch plugin (bolo-torch[clef-omni], transformers 5.10.2 or later) and the
    model repository''s joint_schema_model.py, which runs only after you opt in for this model (allow_remote_code,
    pinned by sha256; docs/models.md, "Remote code"). bfloat16, 70.8 GB with the base model''s unused speech-output
    weights: about 64 GB of GPU memory (Cloudflare''s card: one H200). Apache-2.0. Added, not yet run here: too large
    for this machine. Not on llama.cpp yet (its decision server runs the dense Clef only).'
  source_url: https://huggingface.co/Cloudflare/clef-omni
  validated: untested
  source:
    repo: Cloudflare/clef-omni
    revision: 189097bdeaaaea246bd876310d4ae30f9a50415a
    exclude: [README.md, .gitattributes, '.eval_results/*']
  options:
    plugin_install: pip install "bolo-torch[clef-omni]" (the bolo PyTorch engine plugin, plugins/bolo-torch), then opt
      in to the model's remote code with bolo models config clef-omni --set allow_remote_code=true
    dtype: bfloat16
    max_audio_s: 60.0
    remote_code:
      revision: 189097bdeaaaea246bd876310d4ae30f9a50415a
      reviewed: '2026-11-21: joint_schema_model.py (record encoding, image, audio and video decoding with Pillow and
        PyAV, the joint schema head, load_release_model and systemone). Imports torch, numpy, transformers,
        safetensors and huggingface_hub; it downloads only when given a repository id or a media URL (bolo gives a
        local folder and 16 kHz samples) and writes no files.'
      files:
        joint_schema_model.py: 21d05ebb8cbea26a26af65eca3d16cf4b69bf80a320e2d5b203e86f0d632a670
    not_yet_run: true
    hardware: {gpu: required, vram_gb: 64, note: 'bfloat16; Cloudflare tested one H200'}
