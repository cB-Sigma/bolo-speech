# Orpheus-family text-to-speech on llama.cpp, without PyTorch: the tts-server engine, kind orpheus-llamacpp
# (bolo/engines/orpheus_llamacpp.py). llama-server (llama.cpp, MIT) runs the language model from a GGUF file; bolo
# builds the prompt, streams the generated token ids from /completion and decodes the SNAC 24 kHz codes with
# onnxruntime, using bolo's own export of the SNAC decoder (server/tools/export_snac_onnx.py; fp32, checked
# against PyTorch SNAC). bolo starts llama-server for the model in use (bolo components install llama-server, or the
# setting llama_server_bin) or forwards to one the operator runs with the same GGUF (setting tts_servers,
# "<model id>=<url>"; the GGUF is then not downloaded, the 53 MB decoder is fetched on first load).
# Licences never exclude a model: each entry states licence, commercial_use and gated. options.hardware gives the
# GPU advice and an approximate memory need (weights x 1.3 + 0.5 GB; the KV cache of -c 4096 adds about 0.45 GB).
# Sources, read 2026-11-14: the Hugging Face API for every repository (revision, files, sizes, SHA-256, gating,
# licence tags), the model cards, Kenpath's svara-tts-inference (prompt), canopyai/Orpheus-TTS (prompt, sampling),
# llama.cpp tools/server/README.md (build b12375).
# The SNAC decoder is published at codebucketsolutions/snac-24khz-onnx (the decoder URLs pin its revision).
# validated: untested (no entry was run from the published files); Svara and Veena Q4_K_M were run on a 4-vCPU
# machine with a local export of the decoder, see docs/models.md.
