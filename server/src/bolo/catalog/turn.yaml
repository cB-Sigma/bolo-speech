# End-of-turn models: given the utterance so far, has the speaker finished or only paused? Used by Realtime sessions
# with turn_detection.type = "semantic_vad"; the default_turn setting or a session's turn_detection.turn_model (bolo
# extension) chooses one. Smart Turn v3 listens to the audio (bolo.engines.onnx_turn), Smart Turn v2 too (bolo's NumPy
# code, bolo.engines.smart_turn_v2); the Namo models (bolo.engines.text_turn) and TEN Turn Detection (llama-server,
# bolo.engines.ten_turn_llamacpp) read the transcript (option input: text), which the session decodes at each pause.
# silence-only is no model at all: a pause ends the turn. Models bolo cannot run are listed in
# docs/models-unsupported.md, not here.

