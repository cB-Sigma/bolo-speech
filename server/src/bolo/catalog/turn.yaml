# End-of-turn models: given the utterance so far, has the speaker finished or only paused? Used by Realtime sessions
# with turn_detection.type = "semantic_vad"; the default_turn setting or a session's turn_detection.turn_model (bolo
# extension) chooses one. Smart Turn listens to the audio (bolo.engines.onnx_turn); the Namo models read the
# transcript (option input: text, bolo.engines.text_turn), which the session decodes at each pause. LiveKit's and
# TEN's models are catalogued with their licence terms and runnable: false (not_runnable_reason says why).
# silence-only is no model at all: a pause ends the turn.

