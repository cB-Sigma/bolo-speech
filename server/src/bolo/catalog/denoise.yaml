- id: deepfilternet3
  aliases: [dfn3]
  task: denoise
  engine: onnxruntime
  kind: deepfilternet3_stream
  family: DeepFilterNet
  languages: []
  tier: balanced
  sample_rate: 48000
  size_bytes: 16104687
  params: 2130000
  license: MIT OR Apache-2.0
  license_url: https://github.com/Rikorose/DeepFilterNet#license
  description: 'DeepFilterNet 3 (Schroter et al., Interspeech 2023): full-band (48 kHz) noise suppression with an
    ERB-band mask and deep filtering of the low frequencies. This is the single-graph streaming ONNX export of
    torchDF (grazder/DeepFilterNet, branch torchDF), which carries the STFT and the filtering inside the graph, so
    ONNX Runtime alone runs it (pip install onnxruntime), 10 ms at a time on the CPU. The file is the copy that
    kimtos-labs keeps on Hugging Face, pinned by SHA-256. Option atten_lim_db caps the suppression (0: no cap).'
  source_url: https://github.com/Rikorose/DeepFilterNet
  validated: untested
  source:
