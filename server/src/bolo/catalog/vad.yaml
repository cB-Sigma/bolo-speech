# Voice-activity detectors (task vad): the default_vad setting, the model field of POST /v1/audio/speech/timestamps
# and turn_detection.vad_model of a Realtime session choose one.
# * Silero and TEN VAD run in sherpa-onnx. TEN VAD's files are the ones sherpa-onnx publishes (its asr-models
#   release; they carry the metadata sherpa-onnx reads), with the licence file of the TEN repository.
# * NVIDIA Frame-VAD Multilingual MarbleNet v2.0 runs in ONNX Runtime (bolo.engines.frame_vad). NVIDIA publishes only
#   a .nemo checkpoint; the file is a third-party ONNX export of it (the network without the audio front-end, which
#   bolo computes: 80-band NeMo log-mel).
# * WebRTC's detector is a Gaussian mixture model inside the webrtcvad-wheels package (pip install
#   'bolo-speech[webrtcvad]'): nothing is downloaded, the package version is the pin.
# * energy-vad is bolo's own adaptive energy detector (bolo.streaming.vad.EnergyVad), also the fallback when no
#   neural detector can be used.

