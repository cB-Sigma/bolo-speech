  license_url: https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-open-model-license/
  description: 'NVIDIA Frame-VAD Multilingual MarbleNet v2.0: a 91.5 k-parameter convolutional detector that gives
    a speech probability for every 20 ms frame, trained with white and real-world noise and with non-speech sounds
    (coughs, laughter, breathing) in many languages. NVIDIA publishes a .nemo checkpoint only; the file here is
    a third-party ONNX export of it (TigreGotico/frame-vad-marblenet-onnx). Its convolutions look about 1.4 s either
    side of a frame, so live audio is scored with 0.4 s of look-ahead (option lookahead_s): its decisions then agree
    with whole-file scoring on 99 % of frames, and come 0.4 s after the audio. NVIDIA Open Model License: commercial
    use allowed; the licence ends for whoever sues over the model, and redistributors must keep NVIDIA''s notice.'
  source_url: https://huggingface.co/nvidia/Frame_VAD_Multilingual_MarbleNet_v2.0
