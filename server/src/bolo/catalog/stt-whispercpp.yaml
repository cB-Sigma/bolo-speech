# Whisper models in ggml format for whisper.cpp, run by the whisper.cpp engine (pywhispercpp; bolo-speech[whispercpp]).
# Files from https://huggingface.co/ggerganov/whisper.cpp (MIT, like OpenAI's Whisper weights), pinned to commit
# 5359861c739e955e79d9a303bcbc70fb988958b1 with their size and SHA-256 from the Hugging Face API, read 2026-11-17.
# The quantised files (q5_0, q5_1, q8_0) are whisper.cpp's own quantisations of the same weights: smaller and faster
# on a CPU, a little less accurate. whisper.cpp gives no word timestamps here; segments carry times.
# A multilingual model detects the language when a request names none; the .en models are English only.

