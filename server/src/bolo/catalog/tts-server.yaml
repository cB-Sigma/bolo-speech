# Text-to-speech models served by an external speech server: the tts-server engine (bolo/engines/tts_server.py).
# options.runtime names the server: llama-server (llama.cpp, MIT) or audio.cpp (audiocpp_server, Apache-2.0).
# bolo starts the server for the model in use (bolo components install llama-server / audio.cpp, or the settings
# llama_server_bin / audiocpp_server_bin), or forwards to one the operator runs (setting tts_servers,
# "<model id or runtime>=<url>"; nothing is downloaded then). requires names the runtime; options.hardware gives
# the GPU advice and an approximate memory need (weights x 1.3 + 0.5 GB). Licences never exclude a model: each
# entry states licence, commercial_use and gated. Voices with `reference:` are bolo's synthetic reference clips
# (bolo/samples, made with Kokoro voices), sent to the server as the voice to imitate.
# Sources, read 2026-11-14: llama.cpp tools/tts/README.md and tools/server/README.md (build b12375); audio.cpp
# README, app/server/README.md, app/server/api.md, model_specs/*.json and docs/model_licenses.md (v0.9.4); the
# Hugging Face API for every file (size, revision). validated: untested unless measured. Every entry's files are
# published; models whose runtime files nobody publishes are in docs/models-unsupported.md instead.
- id: chatterbox-multilingual-v3-llamacpp
  task: tts
  engine: tts-server
  kind: tts-server
  family: Chatterbox Multilingual V3
  languages: [en, ar, da, de, el, es, fi, fr, he, hi, it, ja, ko, ms, nl, 'no', pl, pt, ru, sv, sw, tr, zh]
  tier: accuracy
  sample_rate: 24000
  size_bytes: 1153705760
  license: MIT
  license_url: https://huggingface.co/ResembleAI/chatterbox
  commercial_use: true
  gated: false
  features: [voice-cloning]
  description: Resemble AI Chatterbox Multilingual V3 (0.5 B, 23 languages including Hindi) as converted by ggml-org, on
    llama.cpp. Clones a voice from reference audio. No Perth watermark (Resemble's Python package adds it after generation and llama.cpp does not; Resemble's detector found none in Chatterbox Turbo's output on llama.cpp, docs/measurements/voice-cloning-cpu.json). Made for a GPU; on the 4-vCPU test machine a 1.2 s sentence took about 5 minutes. llama.cpp notes that llama-server
    does not run this variant's classifier-free guidance yet (llama-tts does), so quality through the server may be below
    the reference. Runs in a llama-server that bolo starts (bolo components install llama-server) or one you run (setting
    tts_servers).
  source_url: https://huggingface.co/ResembleAI/chatterbox
  validated: untested
  requires: [llama-server]
  source:
    repo: ggml-org/chatterbox-GGUF
    revision: a5c19d4a1377a265a3488d13d9ef53314cc06e81
    include: [chatterbox-Q8_0.gguf, mmproj-chatterbox-F16.gguf]
  options:
    runtime: llama-server
    model_file: chatterbox-Q8_0.gguf
    cloning: true
    send_language: true
    hardware: {gpu: recommended, vram_gb: 2.0, note: 'approximate: weights x 1.3 + 0.5 GB; slow on a CPU'}
    # llama-server's default context for this GGUF reserved 13 GB of KV cache on a 15 GB machine and was killed
    # (2026-11-16); 4096 tokens loads in 2.3 GB and is far more than a sentence needs
    context_size: 4096
    mmproj_file: mmproj-chatterbox-F16.gguf
  voices:
  - {id: default, name: Model default, server_voice: ''}
  - {id: heart, name: Heart (English reference clip), gender: f, reference: en-short}
  - {id: michael, name: Michael (English reference clip), gender: m, reference: en-long}
  - {id: alpha-hi, name: Alpha (Hindi reference clip), gender: f, reference: hi-short}
