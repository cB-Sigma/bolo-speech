[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bolo"
dynamic = ["version"]
description = "A lightweight, torch-free speech server: speech-to-text, text-to-speech and VAD behind OpenAI-compatible, WebSocket and Wyoming APIs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "The bolo Authors" }]
keywords = ["speech", "stt", "tts", "asr", "vad", "whisper", "openai", "wyoming", "telephony", "indic", "onnx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "soundfile>=0.12.1",
  "soxr>=0.5",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
sherpa = ["sherpa-onnx>=2.0,<3"]
faster-whisper = ["faster-whisper>=1.1"]
moonshine = ["useful-moonshine-onnx"]
whispercpp = ["pywhispercpp>=1.3"]
# kokoro-onnx itself is MIT but depends on `phonemizer` (GPL-3.0-or-later).
# It is deliberately NOT part of `all`; Kokoro runs through sherpa-onnx by default.
kokoro-onnx = ["kokoro-onnx>=0.4"]
# uccharan (Apache-2.0): phonemes for Piper, Kitten, Matcha and Kokoro voices in English (US, GB) and Hindi.
uccharan = ["uccharan>=0.1"]
# eSpeak NG (GPL-3.0-or-later) as a prebuilt shared library with its data. Optional, never part of `all`:
# phoneme-based voices in languages uccharan does not cover need it; everything else does not.
espeak = ["espeakng-loader>=0.2.4"]
av = ["av>=12"]
wyoming = ["wyoming>=1.6"]
# WebRTC transport of the Realtime API (aiortc is BSD-3-Clause; it brings PyAV for Opus)
webrtc = ["aiortc>=1.9", "av>=12"]
# end-of-turn detection for Realtime sessions (semantic_vad). faster-whisper already brings onnxruntime.
turn = ["onnxruntime>=1.17"]
text = ["whisper-normalizer>=0.1"]
all = [
  "sherpa-onnx>=2.0,<3",
  "uccharan>=0.1",
  "faster-whisper>=1.1",
  "av>=12",
  "wyoming>=1.6",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "openai>=1.60",
  "websockets>=13",
  "jiwer>=3",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "types-psutil",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/cb-Sigma/bolo"
Documentation = "https://github.com/cb-Sigma/bolo/tree/main/docs"
Issues = "https://github.com/cb-Sigma/bolo/issues"
Changelog = "https://github.com/cb-Sigma/bolo/blob/main/CHANGELOG.md"

[project.scripts]
bolo = "bolo.cli:main"

[tool.hatch.version]
path = "src/bolo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bolo"]
artifacts = ["src/bolo/_ui/**"]

[tool.hatch.build.targets.sdist]
include = ["src/bolo", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
artifacts = ["src/bolo/_ui/**"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PL", "ASYNC", "PTH", "T20"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603", "PLC0415",
  "RUF001", "RUF002", "RUF003",  # Indic and typographic characters are intentional
  "E501", "PLR0917", "B024", "ASYNC240", "ASYNC109", "SIM105", "SIM117", "UP045", "UP007", "PLW2901", "RUF005", "RUF012", "B905", "S603",
]

[tool.ruff.lint.per-file-ignores]
"src/bolo/cli.py" = ["T20"]
"tests/**" = ["T20", "B011", "ASYNC", "RUF007", "S324"]
"tools/**" = ["T20"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/bolo"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "sherpa_onnx.*", "faster_whisper.*", "ctranslate2.*", "soundfile.*", "soxr.*", "av.*",
  "moonshine_onnx.*", "kokoro_onnx.*", "pywhispercpp.*", "wyoming.*", "whisper_normalizer.*",
  "onnxruntime.*", "tomli.*", "aiortc.*", "uccharan.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
  "real: runs real models on CPU (opt-in: needs network and BOLO_TEST_REAL=1)",
  "network: needs network access",
]
