[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bolo-speech"
dynamic = ["version"]
description = "Ollama for speech: the open speech stack, running privately on your own machine. Speech to text, text to speech, voice cloning, diarization and voice agents behind OpenAI-compatible APIs, with a model catalog and a web console. No PyTorch needed."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "The bolo Authors" }]
keywords = [
  "speech", "speech-to-text", "text-to-speech", "stt", "tts", "asr", "vad", "diarization", "voice-agent", "realtime",
  "whisper", "openai", "openai-compatible", "wyoming", "telephony", "sip", "indic", "hindi", "onnx", "self-hosted",
  "voice-cloning", "local", "offline", "privacy", "apple-silicon", "mlx", "metal", "llama-cpp",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "soundfile>=0.12.1",
  "soxr>=0.5",
  "httpx>=0.27",
  # client of speech-to-speech servers (llama-server /v1/realtime); uvicorn[standard] brings it already
  "websockets>=13",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
sherpa = ["sherpa-onnx>=2.0,<3"]
faster-whisper = ["faster-whisper>=1.1"]
moonshine = ["useful-moonshine-onnx"]
whispercpp = ["pywhispercpp>=1.3"]
# Cactus Compute's runtime (Apache-2.0) for Whistle: the package fetches its native engine (libcactus, Apache-2.0)
# from its pinned, checksummed release on Hugging Face the first time a model loads
cactus = ["cactus-compute>=4.2.6,<5"]
# kokoro-onnx itself is MIT but depends on `phonemizer` (GPL-3.0-or-later).
# It is deliberately NOT part of `all`; Kokoro runs through sherpa-onnx by default.
kokoro-onnx = ["kokoro-onnx>=0.4"]
# uccharan (Apache-2.0): phonemes and text normalisation for Piper, Kitten, Matcha and Kokoro voices in 39
# languages, pronunciation word lists and romanised text into native script. 0.6 is the release bolo's language
# table and pack handling are written for (bolo.text.phonemize, bolo.text.packs); 0.6.1 reads numbers in the
# Latin-script languages other than English in the language itself (0.6.0 read them in English); 0.6.2 writes
# Sinhala and Sindhi numbers as words (0.6.1 wrote lookup keys); 0.6.3 and 0.6.4 read dates, ordinals and clock
# times in full and put currency words in the plural.
uccharan = ["uccharan>=0.6.4,<0.7"]
# eSpeak NG (GPL-3.0-or-later) as a prebuilt shared library with its data. Optional, never part of `all`:
# phoneme-based voices in languages uccharan does not cover need it; everything else does not.
espeak = ["espeakng-loader>=0.2.4"]
av = ["av>=12"]
wyoming = ["wyoming>=1.6"]
# WebRTC transport of the Realtime API (aiortc is BSD-3-Clause; it brings PyAV for Opus)
webrtc = ["aiortc>=1.9", "av>=12"]
# full-duplex speech-to-speech models (Moshi, Hibiki, PersonaPlex; bolo.duplex): their servers send Ogg Opus, which
# bolo frames itself and codes with libopus through PyAV. The servers themselves are components
# (`bolo components install moshi`), each in an environment of its own.
duplex = ["av>=12"]
# end-of-turn detection for Realtime sessions (semantic_vad) and the MarbleNet voice-activity detector.
# faster-whisper already brings onnxruntime; tokenizers (Apache-2.0) is for the end-of-turn models that read text.
turn = ["onnxruntime>=1.17", "tokenizers>=0.20"]
# the WebRTC voice-activity detector (webrtcvad-wheels is MIT; the WebRTC code inside is BSD-3-Clause)
webrtcvad = ["webrtcvad-wheels>=2.0.14"]
# spoken-language identification (POST /v1/audio/language, routing with model=auto); faster-whisper brings it too
lid = ["onnxruntime>=1.17"]
# forced alignment (POST /v1/audio/alignments, word times for recognisers without them, captioned speech) runs in
# onnxruntime; uroman (MIT-style, asks that publications acknowledge it) romanizes text for the MMS aligner, which
# knows only Latin letters
align = ["onnxruntime>=1.17", "uroman>=1.3"]
# Orpheus-family voices (Svara, Veena, Orpheus, snorTTS) on llama.cpp: the SNAC audio decoder runs in onnxruntime
orpheus = ["onnxruntime>=1.17"]
# LFM3-Audio in this process (speech-to-speech and text-to-speech without llama-server): the model's ONNX graphs
# use MatMulNBits, GatherBlockQuantized and GroupQueryAttention, which need a recent onnxruntime
s2s = ["onnxruntime>=1.20", "tokenizers>=0.20"]
# MCP tools in Realtime sessions (the MCP Python SDK, MIT): bolo connects to MCP servers named in session.tools
# or in the setting mcp_servers and calls their tools for the language model. 1.x and 2.x both work
mcp = ["mcp>=1.10"]
# echo cancellation for voice agents (bolo.echo): SpeexDSP's canceller through pyaec (BSD-3-Clause + MIT) and
# WebRTC's AEC3 through LiveKit's Python SDK (Apache-2.0 + BSD-3-Clause); DTLN-aec needs only onnxruntime
aec = ["pyaec>=1.0.1", "livekit>=1.0"]
# wake words (bolo.wake): sentencepiece (Apache-2.0) spells your own phrases for the GigaSpeech keyword spotter;
# pymicro-wakeword (Apache-2.0) runs microWakeWord's TensorFlow Lite models and carries them
wake = ["sentencepiece>=0.2", "pymicro-wakeword>=2.0"]
# inbound SIP endpoint for trunks and PBXs (sipmessage is BSD-2-Clause, pure Python: it parses and writes SIP messages)
sip = ["sipmessage>=0.7"]
text = ["whisper-normalizer>=0.1"]
# inverse text normalisation of transcripts ("twenty five dollars" -> "$25", bolo.itn): the runtime of the itn
# models, wetext (WeTextProcessing's grammars, Apache-2.0; it carries its own copy of every language's grammars,
# about 300 MB installed) and kaldifst (rule FSTs, Apache-2.0)
itn = ["wetext>=0.2.1", "kaldifst>=1.7"]
# personal-information redaction of transcripts (bolo.redact): Presidio's analyzer (MIT; it brings spaCy, MIT, for
# pii-presidio-spacy-en) and, for GLiNER, onnxruntime and tokenizers
pii = ["presidio-analyzer>=2.2", "onnxruntime>=1.17", "tokenizers>=0.20"]
# OpenTelemetry export of request traces (Apache-2.0): spans over OTLP/HTTP; off unless switched on (setting otel or
# OTEL_EXPORTER_OTLP_ENDPOINT). For OTLP/gRPC add opentelemetry-exporter-otlp-proto-grpc
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
# NVIDIA GPU memory per process through NVML (BSD-3-Clause), for GPU/CPU placement and `bolo ps`; without it bolo
# asks nvidia-smi
nvidia = ["nvidia-ml-py>=12"]
# cut an ONNX graph that does not fit in free GPU memory in two (onnx is Apache-2.0)
onnx-split = ["onnx>=1.16"]
# faster-whisper (CTranslate2 4.x) on an NVIDIA GPU: CUDA 12's cuBLAS and cuDNN 9 from NVIDIA's wheels (about 1.3 GB;
# NVIDIA's licence), which bolo finds itself (bolo.cuda_libs). Not ONNX Runtime's CUDA build: onnxruntime-gpu has to
# replace onnxruntime, and an extra can only add packages (docs/configuration.md, "CUDA on Windows")
cuda = [
  "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]
# MLX models on Apple silicon's GPU (bolo.engines.mlx, docs/apple-silicon.md): mlx (MIT), mlx-whisper (MIT),
# parakeet-mlx (Apache-2.0) and mlx-audio (MIT; Kokoro), with uccharan for Kokoro's phonemes. macOS arm64 only:
# elsewhere the extra installs nothing (MLX's Linux CPU wheels work, `pip install "mlx[cpu]" mlx-whisper ...`)
mlx = [
  "mlx>=0.25; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "parakeet-mlx>=0.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-audio>=0.2.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "uccharan>=0.6.4,<0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
all = [
  "sherpa-onnx>=2.0,<3",
  "uccharan>=0.6.4,<0.7",
  "faster-whisper>=1.1",
  "av>=12",
  "wyoming>=1.6",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "openai>=1.60",
  "websockets>=13",
  "jiwer>=3",
  # Kyutai's Ogg Opus library (MIT or Apache-2.0): the fake full-duplex server speaks the real framing with it
  "sphn>=0.2,<0.3",
  # python-socketio's server (MIT) stands in for Freeze-Omni's Flask-SocketIO server in the tests
  "python-socketio>=5.11",
  # the MCP Python SDK (MIT): the MCP tool tests of Realtime sessions
  "mcp>=1.10",
  # SpeexDSP's echo canceller (pyaec, BSD-3-Clause + MIT, 0.2 MB): the echo-cancellation tests
  "pyaec>=1.0.1",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "types-psutil",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/cB-Sigma/bolo-speech"
Documentation = "https://github.com/cB-Sigma/bolo-speech/tree/main/docs"
Issues = "https://github.com/cB-Sigma/bolo-speech/issues"
Changelog = "https://github.com/cB-Sigma/bolo-speech/blob/main/CHANGELOG.md"

[project.scripts]
bolo = "bolo.cli:main"

[tool.hatch.version]
path = "src/bolo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bolo"]
artifacts = ["src/bolo/_ui/**"]

[tool.hatch.build.targets.sdist]
include = ["src/bolo", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
artifacts = ["src/bolo/_ui/**"]

[tool.ruff]
line-length = 120
# third-party source carried unchanged (src/bolo/vendor/__init__.py)
extend-exclude = ["src/bolo/vendor/dizione"]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# PLW1514 (open, read_text and write_text without an encoding: the Windows code page otherwise) is a preview rule,
# enabled on its own
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PL", "ASYNC", "PTH", "T20", "PLW1514"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603", "PLC0415",
  "RUF001", "RUF002", "RUF003",  # Indic and typographic characters are intentional
  "E501", "PLR0917", "B024", "ASYNC240", "ASYNC109", "SIM105", "SIM117", "UP045", "UP007", "PLW2901", "RUF005", "RUF012", "B905", "S603",
]

[tool.ruff.lint.per-file-ignores]
"src/bolo/cli.py" = ["T20"]
# a server bolo runs in a model's own environment: it reports on its console
"src/bolo/duplex/servers/*.py" = ["T20"]
"tests/**" = ["T20", "B011", "ASYNC", "RUF007", "S324"]
"tools/**" = ["T20"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/bolo"]
exclude = ["src/bolo/vendor/dizione/"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "sherpa_onnx.*", "faster_whisper.*", "ctranslate2.*", "soundfile.*", "soxr.*", "av.*",
  "moonshine_onnx.*", "kokoro_onnx.*", "cactus", "cactus.*", "pywhispercpp.*", "_pywhispercpp", "wyoming.*", "whisper_normalizer.*",
  "onnxruntime.*", "tomli.*", "aiortc.*", "uccharan.*", "tokenizers.*", "sipmessage.*", "onnx.*", "pynvml.*",
  "opentelemetry.*", "webrtcvad.*", "sphn.*", "torch.*", "transformers.*", "mlx.*", "mlx_whisper.*", "parakeet_mlx.*",
  "mlx_audio.*",
  "mcp.*", "mcp_types.*",
  "pyaec.*", "livekit.*",
  "bolo.vendor.dizione", "bolo.vendor.dizione.*",
  "pypinyin.*", "pymicro_wakeword.*", "sentencepiece.*", "wetext.*", "kaldifst.*", "presidio_analyzer.*", "spacy.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
  "real: runs real models on CPU (opt-in: needs network and BOLO_TEST_REAL=1)",
  "network: needs network access",
]
