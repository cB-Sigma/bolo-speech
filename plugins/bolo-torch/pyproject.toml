[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bolo-torch"
dynamic = ["version"]
description = "PyTorch engine plugin for the bolo speech server: Indic Parler-TTS, IndicF5 and F5-TTS, Veena, Svara, Indic-Speak, SepFormer, pyannote PixIT and DiCoW diarization-conditioned recognition, Qwen-Omni speech-to-speech, run out of process."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The bolo Authors" }]
keywords = ["speech", "tts", "asr", "separation", "diarization", "pytorch", "indic", "bolo", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
# torch comes from PyPI by default (the CUDA build on Linux). For the much smaller CPU-only build install torch
# first from https://download.pytorch.org/whl/cpu (see README.md).
dependencies = [
  "bolo-speech>=0.6.7,<0.7",
  "torch>=2.4",
  "numpy>=1.26",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
# Indic Parler-TTS and other Parler-TTS checkpoints. parler-tts 0.2.3 pins transformers 4.46.1; its audio
# library pins protobuf<5, which sentencepiece 0.2.1+ cannot import with (Indic Parler-TTS's tokenizer needs it).
parler = ["parler-tts>=0.2.3", "sentencepiece>=0.1.99,<0.2.1"]
# IndicF5. The model repository ships its own copy of the f5_tts package; these are the libraries it imports.
f5 = [
  "transformers>=4.46", "vocos>=0.1", "x-transformers>=1.31.14", "torchdiffeq", "ema-pytorch>=0.5.2",
  "accelerate>=0.33", "cached-path", "pydub", "librosa", "matplotlib", "pypinyin", "jieba", "datasets", "wandb",
  "torchaudio>=2.1", "soundfile>=0.12.1",
]
# The original F5-TTS checkpoints (SWivid/F5-TTS, CC-BY-NC-4.0 weights) on the f5-tts package (MIT code). It pins
# its own transformers and other libraries: keep it in its own environment.
f5-original = ["f5-tts>=1.1,<2", "soundfile>=0.12.1"]
# Indic-Speak (gated): the repository's own inference.py needs transformers 5 and SNAC (its quantizer)
indic-speak = ["transformers>=5", "snac>=1.2", "soundfile>=0.12.1"]
# Veena and Svara (Llama-style language model + SNAC codec)
orpheus = ["transformers>=4.46", "snac>=1.2", "accelerate>=0.33"]
# SpeechBrain SepFormer speech separation (not gated)
sepformer = ["speechbrain>=1.0", "torchaudio>=2.1"]
# pyannote PixIT joint diarization and separation (gated). Needs transformers>=4.48.3, so it cannot share an
# environment with the `parler` extra.
pyannote = ["pyannote.audio[separation]>=3.3.2"]
# DiCoW (diarization-conditioned Whisper, BUT-FIT). Its model code is written for transformers 4.55 and imports
# pandas. Cannot share an environment with the `parler` extra (transformers 4.46.1).
dicow = ["transformers>=4.55.0,<4.56", "pandas"]
# Demucs denoiser (facebookresearch/denoiser; code and weights CC-BY-NC-4.0, not for commercial use). Only its model
# class is used: `pip install --no-deps denoiser julius` avoids the training dependencies (hydra 0.11, sounddevice)
demucs-denoiser = ["denoiser>=0.1.5", "julius"]
# Qwen2.5-Omni (transformers 4.52+) and Qwen3-Omni (4.57+) as speech-to-speech models, with transformers' own model
# classes (no remote code). The processors' video part imports torchvision; accelerate splits large models.
omni = ["transformers>=4.57", "accelerate>=0.33", "torchvision"]
# Step-Audio 2 mini (speech-to-speech): the libraries of its model code (Hugging Face remote code, an opt-in per
# model) and of its token2wav decoder (github.com/stepfun-ai/Step-Audio2 at a pinned commit, installed by the plugin:
# `bolo-torch code install step-audio-2`). The authors use transformers 4.49.0; keep it in its own environment.
step-audio-2 = [
  "transformers==4.49.0", "accelerate>=0.33", "torchaudio>=2.1", "librosa", "onnxruntime", "s3tokenizer",
  "hyperpyyaml", "diffusers", "einops", "scipy", "soundfile>=0.12.1",
]
# GLM-4-Voice 9B (speech-to-speech): the libraries of ChatGLM's remote code (opt-in per model) and of the speech
# tokenizer and decoder (github.com/THUDM/GLM-4-Voice and Matcha-TTS at pinned commits, installed by the plugin:
# `bolo-torch code install glm-4-voice`), at the versions of the authors' requirements.txt: transformers 4.44.1;
# diffusers 0.27 needs huggingface-hub below 0.26. bitsandbytes for quantization int4. Its own environment.
glm-4-voice = [
  "transformers==4.44.1", "accelerate>=0.33", "huggingface-hub>=0.23,<0.26", "tiktoken", "torchaudio>=2.1",
  "conformer==0.3.2", "diffusers==0.27.2", "hyperpyyaml==1.2.2", "hydra-core==1.3.2", "lightning==2.2.4",
  "omegaconf==2.3.0", "rich", "einops", "librosa", "soundfile>=0.12.1", "safetensors", "bitsandbytes",
]
# Kimi-Audio 7B Instruct (speech-to-speech): the libraries of kimia_infer (github.com/MoonshotAI/Kimi-Audio at a pinned
# commit, installed by the plugin: `bolo-torch code install kimi-audio`) and of its remote code. Not here: flash-attn,
# which its Whisper encoder imports and which has no wheels on PyPI (`pip install flash-attn --no-build-isolation` on
# Linux with the CUDA toolkit). transformers as when the code was published (spring 2025). NVIDIA GPUs only.
kimi-audio = [
  "transformers>=4.48,<4.52", "accelerate>=0.33", "torchaudio>=2.1", "librosa", "soundfile>=0.12.1", "tqdm", "loguru",
  "tiktoken", "timm", "torchdyn==1.0.6", "safetensors", "pyyaml", "packaging", "ninja",
]
# MiniCPM-o 2.6 (speech-to-speech): the model is Hugging Face remote code (opt in per model); these are the libraries
# it imports, at the model card's versions (transformers 4.44.2, vector-quantize-pytorch 1.18.5, vocos 0.1.0).
minicpm-o = [
  "transformers==4.44.2", "accelerate>=0.33", "torchaudio>=2.1", "torchvision", "Pillow", "librosa", "soundfile>=0.12.1",
  "vector-quantize-pytorch==1.18.5", "vocos==0.1.0",
]
# Voxlect's language identifiers for India (Whisper small or MMS-LID-256 encoders with LoRA; rebuilt from
# transformers' encoder classes, without the Voxlect code)
voxlect = ["transformers>=4.46", "safetensors>=0.4"]
# SpeechBrain ECAPA-TDNN language classifiers (lid-indic-vaani)
speechbrain = ["speechbrain>=1.0", "torchaudio>=2.1"]
# DiariZen diarization (BUT Speech@FIT): the libraries its pipeline imports besides the two packages that come from
# the authors' repository at a pinned commit (diarizen and their pyannote.audio 3.1.1 fork, not on PyPI): install
# those in the same command, in an environment of their own (the fork replaces pyannote.audio), see README.md.
# torchaudio 2.9 reads audio only through torchcodec, which the pipeline's torchaudio.load does not expect.
diarizen = ["toml", "accelerate>=0.33", "scipy", "soundfile>=0.12.1", "torchaudio>=2.1,<2.9"]
# Spark-TTS 0.5B: the libraries of the authors' sparktts package (BiCodec), which the plugin installs itself from
# github.com/SparkAudio/Spark-TTS at a pinned commit (`bolo-torch code install spark-tts`). The language model is a
# plain Qwen2 checkpoint; the authors use transformers 4.46.2.
spark-tts = [
  "transformers>=4.46", "einops>=0.8", "einx>=0.3", "omegaconf>=2.3", "safetensors", "soundfile>=0.12.1", "soxr",
  "torchaudio>=2.1", "tqdm", "packaging",
]
# MaskGCT (Amphion): the libraries of the authors' pipeline and its phoneme front end, which the plugin installs itself
# from github.com/open-mmlab/Amphion at a pinned commit (`bolo-torch code install maskgct`). Its language-model layers
# need transformers before 4.48 (the authors use 4.41.2). LangSegment 0.2.0 is the only release left on PyPI;
# pyopenjtalk-plus has wheels where pyopenjtalk has none. The GPL-licensed parts of the front end (phonemizer with
# espeak-ng, pykakasi, Unidecode) are not here: install them yourself (README.md).
maskgct = [
  "transformers>=4.41,<4.48", "safetensors", "librosa", "soundfile>=0.12.1", "einops", "json5", "ruamel.yaml", "six",
  "tokenizers", "onnxruntime", "inflect", "jieba", "cn2an", "pypinyin", "LangSegment==0.2.0", "pyopenjtalk-plus",
  "scipy", "tqdm",
]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.8", "mypy>=1.13", "build", "twine"]

[project.scripts]
bolo-torch = "bolo_torch.cli:main"

[project.entry-points."bolo.engines"]
torch = "bolo_torch:plugin"

[project.urls]
Homepage = "https://github.com/cB-Sigma/bolo-speech/tree/main/plugins/bolo-torch"
Documentation = "https://github.com/cB-Sigma/bolo-speech/blob/main/plugins/bolo-torch/README.md"
Issues = "https://github.com/cB-Sigma/bolo-speech/issues"
Changelog = "https://github.com/cB-Sigma/bolo-speech/blob/main/plugins/bolo-torch/CHANGELOG.md"

[tool.hatch.version]
path = "src/bolo_torch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bolo_torch"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PL", "PTH", "T20"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603", "PLC0415",
  "RUF001", "RUF002", "RUF003", "E501", "PLR0917", "B024", "SIM105", "UP045", "UP007", "PLW2901", "RUF005",
  "RUF012", "B905",
]

[tool.ruff.lint.per-file-ignores]
"src/bolo_torch/cli.py" = ["T20"]
"tests/**" = ["T20", "B011"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/bolo_torch"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "parler_tts.*", "speechbrain.*", "pyannote.*", "snac.*", "transformers.*", "soxr.*", "soundfile.*",
  "huggingface_hub.*", "torchaudio.*", "yaml.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: downloads and runs real models (opt in with BOLO_TORCH_TEST_REAL=1)"]
timeout = 600
