name: Release

# Publishes the Python package to PyPI, creates the GitHub release (and its tag) and
# pushes the container image to the GitHub Container Registry.
#
# Two ways to run it:
#   * Actions tab -> Release -> "Run workflow" on main. The version is read from
#     server/src/bolo/__init__.py and the tag vX.Y.Z is created by this workflow.
#   * Push a tag vX.Y.Z (it must match the package version).
#
# Publishes through PyPI trusted publishing: bolo-speech and bolo-torch each list this repository and
# release.yml as a trusted publisher on PyPI; no token is stored.
#
# The PyTorch engine plugin (plugins/bolo-torch) is released separately: "Run workflow" with
# package = bolo-torch. It builds the plugin, publishes it to PyPI the same way and
# creates the GitHub release bolo-torch-vX.Y.Z; nothing of bolo itself runs. Publish bolo first: the
# plugin depends on bolo>=0.2. The first upload of a new PyPI project needs a token that is not
# scoped to an existing project (an account-wide token, or add a project-scoped one afterwards), and
# PyPI limits how many new projects an account may create per day (4 at the time of writing), so
# a first release of bolo and bolo-torch on the same day counts two.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "What to release"
        type: choice
        options: [bolo, bolo-torch]
        default: bolo

permissions:
  contents: read

jobs:
  build:
    name: build distribution
    if: github.event_name == 'push' || inputs.package == 'bolo'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web console into the Python package
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read the package version
        id: version
        run: |
          version="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('server/src/bolo/__init__.py').read_text()).group(1))")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package version: ${version}"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v${{ steps.version.outputs.version }}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version ${{ steps.version.outputs.version }}"; exit 1; }
      - name: Refuse to release a version that already has a release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v${{ steps.version.outputs.version }} already exists; bump __version__ first"; exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python tools/pypi_readme.py README.md server/README.md   # links and images as absolute URLs, for the PyPI page
          cp LICENSE NOTICE server/
          python -m build server
          twine check server/dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: server/dist/

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing: no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release and tag
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the tag and the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release (and the tag, when started by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes dist/* --repo "$GITHUB_REPOSITORY"
          fi

  image:
    name: container image
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web console into the Python package
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Image extras (uccharan 0.6 is on PyPI; the extra pins it)
        id: extras
        run: echo "extras=sherpa,faster-whisper,moonshine,av,wyoming,uccharan" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build the image and smoke-test it before pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: bolo:release-test
          build-args: EXTRAS=${{ steps.extras.outputs.extras }}
          cache-from: type=gha
      - run: deploy/smoke_test.sh bolo:release-test
      - name: Image name (the registry wants lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # the version comes from the package, so a manual run tags the image the same way as a tag push
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.build.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.build.outputs.version }}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: EXTRAS=${{ steps.extras.outputs.extras }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plugin-torch-build:
    name: build bolo-torch
    if: github.event_name == 'workflow_dispatch' && inputs.package == 'bolo-torch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: plugins/bolo-torch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read the plugin version
        id: version
        run: |
          version="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/bolo_torch/__init__.py').read_text()).group(1))")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "plugin version: ${version}"
      - name: Refuse to release a version that already has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "bolo-torch-v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release bolo-torch-v${{ steps.version.outputs.version }} already exists; bump __version__ first"; exit 1
          fi
      - name: Test against CPU torch before publishing
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ../../server -e ".[dev]"
          pytest -q
      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-bolo-torch
          path: plugins/bolo-torch/dist/

  plugin-torch-pypi:
    name: publish bolo-torch to PyPI
    needs: plugin-torch-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing: no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-bolo-torch
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  plugin-torch-release:
    name: bolo-torch GitHub release and tag
    needs: [plugin-torch-build, plugin-torch-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-bolo-torch
          path: dist/
      - name: Create the release (and the tag bolo-torch-vX.Y.Z)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plugin-torch-build.outputs.version }}
        run: |
          gh release create "bolo-torch-v$VERSION" --target "$GITHUB_SHA" --title "bolo-torch $VERSION" \
            --notes "The PyTorch engine plugin of bolo. See plugins/bolo-torch/CHANGELOG.md." dist/* --repo "$GITHUB_REPOSITORY"
