name: Release

# Push a tag like v0.1.0 to publish the Python package (PyPI trusted publishing,
# no token stored in the repository) and the container image (GitHub Container Registry).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web console into the Python package
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('server/src/bolo/__init__.py').read_text()).group(1))")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          cp README.md LICENSE NOTICE server/
          python -m build server
          twine check server/dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: server/dist/

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bolo-speech/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web console into the Python package
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
