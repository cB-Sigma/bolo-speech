name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # a push to main lets the running workflow finish (the next one waits): the macOS and Windows jobs take longer than
  # the gap between pushes, and were never reaching the end
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server:
    name: server (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install (every dependency is named here on purpose)
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115" "uvicorn[standard]>=0.30" "python-multipart>=0.0.9" "numpy>=1.26" \
            "soundfile>=0.12.1" "soxr>=0.5" "httpx>=0.27" "pyyaml>=6.0" "psutil>=5.9" \
            "sherpa-onnx>=2.0,<3" "faster-whisper>=1.1" "av>=12" "wyoming>=1.6" "aiortc>=1.9" \
            "opentelemetry-sdk>=1.27" "opentelemetry-exporter-otlp-proto-http>=1.27" \
            "pytest>=8" "pytest-asyncio>=0.24" "pytest-timeout>=2.3" "openai>=1.60" "websockets>=13" \
            "ruff>=0.8" "mypy>=1.13" types-PyYAML types-psutil build twine "onnx>=1.16"
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest -q
      - name: Build and check the distribution
        run: |
          python ../tools/pypi_readme.py --check ../README.md README.md
          python -m build
          twine check dist/*
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/bolo --version
          /tmp/clean/bin/bolo doctor
          /tmp/clean/bin/bolo serve --port 8765 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:8765/api/v1/info | python -m json.tool > /dev/null
          curl -fsS http://127.0.0.1:8765/api/v1/catalog | python -c "import json,sys; assert len(json.load(sys.stdin)['models']) > 100"
          kill %1

  macos:
    name: server on macOS (Apple Silicon, Python 3.12)
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115" "uvicorn[standard]>=0.30" "python-multipart>=0.0.9" "numpy>=1.26" \
            "soundfile>=0.12.1" "soxr>=0.5" "httpx>=0.27" "pyyaml>=6.0" "psutil>=5.9" \
            "sherpa-onnx>=2.0,<3" "faster-whisper>=1.1" "av>=12" "wyoming>=1.6" "aiortc>=1.9" \
            "opentelemetry-sdk>=1.27" "opentelemetry-exporter-otlp-proto-http>=1.27" \
            "pytest>=8" "pytest-asyncio>=0.24" "pytest-timeout>=2.3" "openai>=1.60" "websockets>=13" \
            "onnx>=1.16" build
          python -m pip install --no-deps -e .
      - name: Test
        run: pytest -q
      - name: Wheel in a clean environment
        run: |
          python -m build --wheel
          python -m venv /tmp/clean
          # [sherpa]: the transcription below runs Moonshine through sherpa-onnx (CPU and CoreML)
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[sherpa]"
          /tmp/clean/bin/bolo --version
          /tmp/clean/bin/bolo doctor
      - name: Transcribe a sample on the CPU and through CoreML
        run: |
          # pulled beforehand, so a download problem shows here and not as an HTTP status below
          BOLO_DATA_DIR=/tmp/bolo-data /tmp/clean/bin/bolo pull moonshine-tiny-en
          for device in cpu coreml; do
            BOLO_DATA_DIR=/tmp/bolo-data BOLO_DEVICE=$device /tmp/clean/bin/bolo serve --port 8765 > /tmp/serve-$device.log 2>&1 &
            for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/healthz > /dev/null && break || sleep 1; done
            if ! curl -sS --fail-with-body -X POST http://127.0.0.1:8765/v1/audio/transcriptions \
              -F model=moonshine-tiny-en -F file=@src/bolo/samples/en-short.wav -o /tmp/text-$device.json; then
              echo "== $device: the answer"; cat /tmp/text-$device.json; echo
              echo "== $device: the server's log"; cat /tmp/serve-$device.log
              exit 1
            fi
            echo "== $device: transcript"; cat /tmp/text-$device.json; echo
            echo "== $device: where the model runs"; curl -fsS http://127.0.0.1:8765/api/v1/ps; echo
            grep -i "morning" /tmp/text-$device.json
            kill %1; wait %1 || true
          done
          echo "== CoreML log lines"; grep -i -E "coreml|fall" /tmp/serve-coreml.log || true
      - name: llama-server for Apple Silicon (Metal build)
        run: |
          BOLO_DATA_DIR=/tmp/bolo-data /tmp/clean/bin/bolo components install llama-server
          BOLO_DATA_DIR=/tmp/bolo-data /tmp/clean/bin/bolo doctor | tee /tmp/doctor.txt
          grep -i -E "metal|llama" /tmp/doctor.txt || true
          echo "== the devices the Metal build sees"
          "$(find /tmp/bolo-data/components/llama-server -name llama-server -type f | head -1)" --list-devices
      - name: whisper.cpp (Metal), MLX models and the torch plugin (MPS) with device = auto
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "1"
        run: |
          # [whispercpp]: pywhispercpp's macOS arm64 wheel (Metal); [mlx]: mlx, mlx-whisper, parakeet-mlx, mlx-audio
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[sherpa,whispercpp,mlx]"
          /tmp/clean/bin/python - <<'PY'
          import mlx.core as mx
          print("MLX", mx.__version__, "default device:", mx.default_device(), "Metal:", mx.metal.is_available())
          import _pywhispercpp as pw
          print("whisper.cpp:", pw.whisper_print_system_info())
          PY
          export BOLO_DATA_DIR=/tmp/bolo-data
          for m in whispercpp-tiny whisper-tiny-mlx parakeet-tdt-ctc-110m-mlx kokoro-v1.0-mlx; do /tmp/clean/bin/bolo pull $m; done
          BOLO_DEVICE=auto /tmp/clean/bin/bolo serve --port 8765 > /tmp/serve-auto.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/healthz > /dev/null && break || sleep 1; done
          fail() { echo "== $1"; cat /tmp/answer; echo; echo "== the server's log"; cat /tmp/serve-auto.log; exit 1; }
          for m in whispercpp-tiny whisper-tiny-mlx parakeet-tdt-ctc-110m-mlx; do
            curl -sS --fail-with-body -X POST http://127.0.0.1:8765/v1/audio/transcriptions -F model=$m \
              -F file=@src/bolo/samples/en-short.wav -o /tmp/answer || fail "$m failed"
            echo "== $m: $(cat /tmp/answer)"
            grep -i "morning" /tmp/answer || fail "$m: no 'morning' in the transcript"
          done
          curl -sS --fail-with-body -X POST http://127.0.0.1:8765/v1/audio/speech -H 'content-type: application/json' \
            -d '{"model": "kokoro-v1.0-mlx", "voice": "af_heart", "input": "Good morning. Your order arrives on Friday.", "response_format": "wav"}' \
            -o /tmp/kokoro.wav || { cp /tmp/kokoro.wav /tmp/answer; fail "kokoro-v1.0-mlx failed"; }
          curl -sS --fail-with-body -X POST http://127.0.0.1:8765/v1/audio/transcriptions -F model=whisper-tiny-mlx \
            -F file=@/tmp/kokoro.wav -o /tmp/answer || fail "the round trip failed"
          echo "== kokoro-v1.0-mlx said: $(cat /tmp/answer)"
          grep -i "friday" /tmp/answer || fail "Kokoro on MLX: no 'Friday' in the round trip"
          echo "== where each model runs (device, runtime, notice)"
          curl -fsS http://127.0.0.1:8765/api/v1/ps | /tmp/clean/bin/python -c "
          import json, sys
          for m in json.load(sys.stdin)['models']:
              p = m.get('placement') or {}
              print(m['name'], m['processor'], m['device'], p.get('runtime'), p.get('notice') or '')
          "
          /tmp/clean/bin/bolo ps --verbose --url http://127.0.0.1:8765
          kill %1; wait %1 || true
          echo "== the torch plugin: bolo-torch with SepFormer (separation), device auto (MPS where the runner has it)"
          /tmp/clean/bin/pip install "../plugins/bolo-torch[sepformer]"
          /tmp/clean/bin/bolo-torch doctor
          /tmp/clean/bin/python -c "import torch; print('MPS built:', torch.backends.mps.is_built(), 'available:', torch.backends.mps.is_available())"
          /tmp/clean/bin/python -c "
          import numpy as np, soundfile as sf
          a, r = sf.read('src/bolo/samples/en-short.wav', dtype='float32')
          b = np.roll(a, r // 2) * 0.8
          sf.write('/tmp/mix.wav', a + b, r)
          "
          /tmp/clean/bin/bolo-torch separate /tmp/mix.wav -o /tmp/separated --device auto | tee /tmp/separated.json
          /tmp/clean/bin/bolo doctor | tee /tmp/doctor.txt
          grep -E "pywhispercpp|MLX|torch plugin" /tmp/doctor.txt

  windows:
    name: server on Windows (Python 3.12, CPU)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install (the CPU wheels that exist for win_amd64)
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115" "uvicorn[standard]>=0.30" "python-multipart>=0.0.9" "numpy>=1.26" \
            "soundfile>=0.12.1" "soxr>=0.5" "httpx>=0.27" "pyyaml>=6.0" "psutil>=5.9" \
            "sherpa-onnx>=2.0,<3" "faster-whisper>=1.1" "av>=12" "wyoming>=1.6" "aiortc>=1.9" \
            "opentelemetry-sdk>=1.27" "opentelemetry-exporter-otlp-proto-http>=1.27" \
            "uccharan>=0.6.4,<0.7" \
            "pytest>=8" "pytest-asyncio>=0.24" "pytest-timeout>=2.3" "openai>=1.60" "websockets>=13" \
            "mypy>=1.13" types-PyYAML types-psutil "onnx>=1.16"
          python -m pip install --no-deps -e .
      - name: Type-check (the Windows branches of the code)
        run: mypy
      - name: Test
        run: pytest -v -ra --durations=10  # -v: a test that hangs is named before the timeout ends the run
      - name: Install into a clean environment and smoke-test it
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\clean"
          & "$env:RUNNER_TEMP\clean\Scripts\python.exe" -m pip install --quiet .
          $bolo = "$env:RUNNER_TEMP\clean\Scripts\bolo.exe"
          & $bolo --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $bolo doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $server = Start-Process -FilePath $bolo -ArgumentList "serve", "--port", "8765" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8765/healthz | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Stop-Process -Id $server.Id -Force; throw "bolo serve did not answer /healthz" }
          $info = Invoke-RestMethod http://127.0.0.1:8765/api/v1/info
          $catalog = Invoke-RestMethod http://127.0.0.1:8765/api/v1/catalog
          if ($catalog.models.Count -le 100) { throw "the catalog has $($catalog.models.Count) models" }
          Stop-Process -Id $server.Id -Force

  plugin-torch-windows:
    name: bolo-torch plugin on Windows (CPU torch, fast tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/bolo-torch
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            plugins/bolo-torch/pyproject.toml
      - name: Install CPU torch, bolo and the plugin (no model libraries, no downloads)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ../../server
          python -m pip install -e ".[dev]"
      - name: Test (fake model backends; the plugin runs as a real subprocess behind bolo's plugin host)
        run: pytest -q -ra

  image:
    name: container image (build and smoke test, not pushed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image extras (uccharan 0.6 is on PyPI; the extra pins it)
        id: extras
        run: echo "extras=sherpa,faster-whisper,moonshine,av,wyoming,uccharan" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build the CPU image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: bolo:ci
          build-args: EXTRAS=${{ steps.extras.outputs.extras }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health, synthesis, transcription of the synthesised audio)
        run: deploy/smoke_test.sh bolo:ci

  ui:
    name: web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  real-models:
    name: real models on CPU (small)
    runs-on: ubuntu-latest
    needs: server
    defaults:
      run:
        working-directory: server
    env:
      BOLO_TEST_REAL: "1"
      BOLO_DATA_DIR: ${{ github.workspace }}/.bolo-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115" "uvicorn[standard]>=0.30" "python-multipart>=0.0.9" "numpy>=1.26" \
            "soundfile>=0.12.1" "soxr>=0.5" "httpx>=0.27" "pyyaml>=6.0" "psutil>=5.9" \
            "sherpa-onnx>=2.0,<3" "faster-whisper>=1.1" \
            "pytest>=8" "pytest-asyncio>=0.24" "pytest-timeout>=2.3" "openai>=1.60" "websockets>=13"
          python -m pip install --no-deps -e .
      - name: Install the espeak-ng phonemiser (GPL; a separate program, used by the Piper-voice tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Cache models
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.bolo-cache
          key: bolo-models-${{ hashFiles('server/src/bolo/catalog/*.yaml') }}
      - name: Run the small real-model tests
        run: pytest -q -m real -k "not large" --timeout 900

  catalog-check-tiny:
    name: bolo check --tiny over the catalog (CPU torch, no weights; not required yet)
    runs-on: ubuntu-latest
    # informative while it settles: a failure here does not block a merge
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            plugins/bolo-torch/pyproject.toml
      - name: Install CPU torch, bolo, the plugin and the libraries the tiny builds need (no model weights)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e server
          python -m pip install -e plugins/bolo-torch
          python -m pip install transformers accelerate snac
      - name: Check every entry --tiny can build (configuration and reviewed code only)
        run: |
          bolo check --all --tiny --allow-remote-code --data-dir "$RUNNER_TEMP/bolo" --json > check-tiny.json || status=$?
          python - <<'PY'
          import json
          for r in json.load(open("check-tiny.json")):
              print(f"{r['model']}: {'ok' if r['ok'] else 'FAILED'}")
              for s in r["steps"]:
                  print(f"  [{s['status']}] {s['name']}: {s['detail'][:300]}")
          PY
          exit ${status:-0}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-tiny
          path: check-tiny.json

  plugin-torch:
    name: bolo-torch plugin (CPU torch, fast tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/bolo-torch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/pyproject.toml
            plugins/bolo-torch/pyproject.toml
      - name: Install CPU torch, bolo and the plugin (no model libraries, no downloads)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ../../server
          python -m pip install -e ".[dev]"
          # transformers and accelerate (no model downloads): planning a GPU/CPU split of a fake model
          python -m pip install transformers accelerate
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type-check
        run: mypy
      - name: Test (fake model backends; the plugin runs as a real subprocess behind bolo's plugin host)
        run: pytest -q
      - name: Build and check the distribution
        run: |
          python -m build
          twine check dist/*
