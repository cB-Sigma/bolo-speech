name: Voices

# Converts models that exist only as PyTorch checkpoints to formats bolo loads without PyTorch, and publishes
# one archive per model, SHA256SUMS and voices.json as assets of a release of this repository:
#   tools/voices/syspin.json   IISc SYSPIN VITS voices (MIT)            -> export_syspin.py
#   tools/voices/mms.json      Meta MMS-TTS voices (CC-BY-NC-4.0)       -> export_mms.py
#   tools/voices/whisper.json  Whisper fine-tunes -> CTranslate2 int8   -> convert_whisper.py
# With the repository secret HF_TOKEN, each model is also uploaded to its own public Hugging Face repository
# under codebucketsolutions/ (tools/voices/publish_hf.py); without it that step is skipped.
# Afterwards: python tools/voices/update_catalog.py (see tools/voices/README.md).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that holds the voices
        default: voices-v1
        required: true
      voices:
        description: Comma-separated model ids (empty = every model in tools/voices/{syspin,mms,whisper}.json)
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: voices-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  list:
    name: list voices
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          ONLY: ${{ inputs.voices }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          sets = {"syspin": "export_syspin.py", "mms": "export_mms.py", "whisper": "convert_whisper.py"}
          items = {}
          for name, script in sets.items():
              path = f"tools/voices/{name}.json"
              if os.path.isfile(path):
                  for v in json.load(open(path, encoding="utf-8"))["voices"]:
                      items[v["id"]] = {"voice": v["id"], "script": script, "requirements": f"requirements-{name}.txt"}
          only = [x.strip() for x in os.environ.get("ONLY", "").split(",") if x.strip()]
          unknown = sorted(set(only) - set(items))
          if unknown:
              raise SystemExit(f"unknown model ids: {unknown}")
          print("matrix=" + json.dumps({"include": [items[i] for i in (only or items)]}))
          PY

  export:
    name: export ${{ matrix.voice }}
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the export tools (CPU PyTorch and what the converter needs)
        env:
          REQS: ${{ matrix.requirements }}
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.8.*" "torchaudio==2.8.*" --index-url https://download.pytorch.org/whl/cpu
          pip install -r "tools/voices/$REQS"
      - name: Convert, smoke-test and pack
        run: python "tools/voices/${{ matrix.script }}" --out dist --only "${{ matrix.voice }}"
      - uses: actions/upload-artifact@v7
        with:
          name: voice-${{ matrix.voice }}
          path: |
            dist/*.tar.gz
            dist/voices.json
          retention-days: 3

  release:
    name: publish release assets
    needs: export
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates or updates the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: voice-*
          path: parts
      - name: Merge the index and write SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          # keep the entries of voices published by earlier runs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern voices.json --dir previous 2>/dev/null || true
          python3 - <<'PY'
          import glob, hashlib, json, os, shutil
          entries, meta = {}, {}
          for path in ["previous/voices.json", *sorted(glob.glob("parts/*/voices.json"))]:
              if os.path.isfile(path):
                  doc = json.load(open(path, encoding="utf-8"))
                  meta.update({k: v for k, v in doc.items() if k != "voices"})
                  entries.update({v["id"]: v for v in doc.get("voices", [])})
          for archive in glob.glob("parts/*/*.tar.gz"):
              shutil.copy2(archive, "dist/")
              name = os.path.basename(archive)
              digest = hashlib.sha256(open(archive, "rb").read()).hexdigest()
              entry = next(v for v in entries.values() if v["file"] == name)
              assert entry["sha256"] == digest, f"{name}: checksum changed between jobs"
          if not entries:
              raise SystemExit("no voice was exported")
          meta["release"] = os.environ["TAG"]
          meta["voices"] = [entries[k] for k in sorted(entries)]
          json.dump(meta, open("dist/voices.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          with open("dist/SHA256SUMS", "w", encoding="utf-8") as sums:
              for key in sorted(entries):
                  sums.write(f"{entries[key]['sha256']}  {entries[key]['file']}\n")
          PY
          ls -l dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Voices ($TAG)" \
              --notes "Models converted for bolo by tools/voices (see tools/voices/README.md). IISc SYSPIN VITS voices: weights MIT, training data SYSPIN corpus CC-BY-4.0, by the SYSPIN project, SPIRE Lab, Indian Institute of Science. Meta MMS-TTS voices: CC-BY-NC-4.0, non-commercial use only. Each archive contains LICENSE and ATTRIBUTION; see voices.json for the licence of each. This is not a bolo software release."
          fi
      - name: Upload to Hugging Face (only with the HF_TOKEN secret)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "No HF_TOKEN secret: skipping the Hugging Face upload."
            exit 0
          fi
          python -m pip install "huggingface_hub>=0.25"
          python tools/voices/publish_hf.py --dist dist
          # voices.json now records the Hub repository and commit of each model
          gh release upload "$TAG" dist/voices.json --clobber --repo "$GITHUB_REPOSITORY"
