name: Live demo

# Builds the browser-only demo of the web console and publishes it to GitHub Pages
# (https://cb-sigma.github.io/bolo/). Requires Settings → Pages → Source: "GitHub Actions".
#
# The demo also speaks, in the browser. Its voices are served from the Pages site itself (same
# origin: release assets carry no CORS headers, so a page cannot fetch them). They are not in git:
# this workflow takes the SYSPIN voices that the "Voices" workflow published as assets of the
# voices-v1 release, plus one Piper voice from Hugging Face at a pinned revision, shrinks them for
# the browser (ui/scripts/voices/build.py; numpy + onnx + onnxruntime, no PyTorch, a few minutes)
# and caches the result. Voices not published yet are left out and the demo says so.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Rebuild when new voices have been published.
  workflow_run:
    workflows: [Voices]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
        env:
          # onnxruntime-node is a Node-only dependency of the in-browser runtime; its binary is not needed.
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Build the demo
        working-directory: ui
        run: npm run build:demo
      - name: Look up the published voices
        id: voices
        run: |
          # The release index changes whenever voices are (re)published; it is part of the cache key.
          curl -fsSL -o voices-release.json https://github.com/cb-Sigma/bolo/releases/download/voices-v1/voices.json \
            || echo '{}' > voices-release.json
          echo "release=$(sha256sum voices-release.json | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: voice-cache
        with:
          path: .voices
          key: browser-voices-${{ steps.voices.outputs.release }}-${{ hashFiles('ui/scripts/voices/**', 'ui/src/vendor/uccharan/data/**') }}
      - uses: actions/setup-python@v7
        if: steps.voice-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Prepare the voices for the browser
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet onnx onnxruntime numpy
          python ui/scripts/voices/build.py --out .voices --skip-missing
      - name: Add the voices to the site
        run: |
          cp -r .voices ui/dist-demo/voices
          du -sh ui/dist-demo ui/dist-demo/voices
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
