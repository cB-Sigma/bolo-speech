<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="bolo web console: try speech models, watch latency, benchmark concurrency." />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="bolo" />
    <meta property="og:title" content="bolo: an open-source speech server with a latency-first console" />
    <meta
      property="og:description"
      content="Pull a speech model, serve it over the APIs you already use, and watch every millisecond. Speech to text, text to speech and voice activity detection."
    />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="bolo: Ollama for speech" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="bolo: an open-source speech server with a latency-first console" />
    <meta name="twitter:description" content="Pull a speech model, serve it, and watch every millisecond." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>bolo</title>
    <script>
      // Apply the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bolo.theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>The bolo console needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
